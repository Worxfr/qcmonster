name: deploy
# Deploiement par OIDC, SANS cle d'acces. Role cree par infra-bootstrap/setup-oidc.sh (lance par le propriétaire).
# Tant que la variable de depot DEPLOY_ENABLED n'est pas 'true', RIEN ne se deploie (ni push sur main, ni lancement manuel).
# A activer par le propriétaire apres: bootstrap OIDC + cdk bootstrap + validation de l'estimation de cout (docs/ops/bootstrap.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Environnement a deployer
        type: choice
        options: [dev, prod]
        default: dev
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy-dev:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      QCM_ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: ce job a id-token: write, aucun script d'installation tiers ne doit s'y executer.
      - run: npm ci --ignore-scripts
      - name: Adresse d'alerte presente
        run: test -n "$QCM_ALERT_EMAIL" || { echo "Variable ALERT_EMAIL (environnement dev) manquante"; exit 1; }
      - name: Secret de depot AWS_ACCOUNT_ID present
        run: test -n "$AWS_ACCOUNT_ID" || { echo "Secret de depot AWS_ACCOUNT_ID manquant"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/QCMonster-GitHubActions-Deploy
          aws-region: eu-west-3
      # `-c bedrock=real` est indispensable: sans lui les Lambdas du traitement tournent avec le FAUX modele (reponse `{}`), et tout scan echoue a la transcription.
      - name: cdk deploy dev
        run: |
          cd infra
          npx cdk deploy --all -c env=dev -c bedrock=real --require-approval never --outputs-file ../cdk-outputs.json
      # Build du front avec l'adresse de l'API et les identifiants PUBLICS du client Cognito, lus dans les sorties CloudFormation
      # (ni compte ni secret). Mode simule jamais actif: VITE_AUTH_MODE vide, et env.ts l'ignore de toute facon en build de production.
      - name: Valeurs du front (sorties CDK)
        run: node scripts/front-env.mjs cdk-outputs.json dev >> "$GITHUB_ENV"
      # vite build seul: les tests (jobs `checks`) n'aiment pas les VITE_* exportes (ils forcent leur propre environnement).
      - name: Build du front
        env:
          VITE_AUTH_MODE: ''
        run: |
          cd web
          npx vite build
          node scripts/check-build.mjs
      - name: Le build ne contient ni mode simule ni adresse locale
        run: "! grep -rlE 'localhost:4010|127[.]0[.]0[.]1:401' web/dist"
      - name: Publication du site (S3 + invalidation CloudFront, par CDK)
        run: |
          cd infra
          npx cdk deploy qcm-dev-web-content -c env=dev -c webDist=../web/dist --require-approval never
  deploy-prod:
    needs: deploy-dev
    # Lancement manuel seulement, depuis main, apres dev. Pas de relecteur obligatoire sur l'environnement `prod`: le plan GitHub
    # (depot prive) ne le permet pas. La garde reste DEPLOY_ENABLED (variable de depot), a ne pas activer pour prod sans accord.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      QCM_ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: ce job a id-token: write, aucun script d'installation tiers ne doit s'y executer.
      - run: npm ci --ignore-scripts
      - name: Origine du front presente
        run: test -n "$WEB_ORIGIN" || { echo "Variable WEB_ORIGIN (environnement prod) manquante"; exit 1; }
      - name: Adresse d'alerte presente
        run: test -n "$QCM_ALERT_EMAIL" || { echo "Variable ALERT_EMAIL (environnement prod) manquante"; exit 1; }
      - name: Secret de depot AWS_ACCOUNT_ID present
        run: test -n "$AWS_ACCOUNT_ID" || { echo "Secret de depot AWS_ACCOUNT_ID manquant"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/QCMonster-GitHubActions-Deploy
          aws-region: eu-west-3
      - name: cdk diff prod
        run: |
          cd infra
          npx cdk diff -c env=prod -c webOrigin="$WEB_ORIGIN" || true
      - name: cdk deploy prod
        run: |
          cd infra
          npx cdk deploy --all -c env=prod -c webOrigin="$WEB_ORIGIN" --require-approval never
