# Genere un code d'invitation parent (a usage unique) pour l'environnement dev, sans AWS CLI chez le propriétaire.
# Lancement MANUEL seulement (onglet Actions > invite > Run workflow). Le code n'apparait que dans le RESUME du job (depot prive),
# jamais dans les journaux: il est masque avant toute ecriture. Seul son hache est stocke dans DynamoDB (scripts/create-invite.ts).
# Prerequis (une fois, par le propriétaire): un role OIDC DEDIE `QCMonster-GitHubActions-Invite` limite a dynamodb:PutItem sur la table qcm-dev
# avec dynamodb:LeadingKeys INVITE#*, et le secret de depot AWS_ACCOUNT_ID (deja utilise par deploy.yml). Procedure complete: rapport F1.
name: invite
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: invite
jobs:
  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/QCMonster-GitHubActions-Invite
          aws-region: eu-west-3
      - name: Creer l'invitation (code masque dans les journaux)
        run: |
          set -euo pipefail
          out="$(mktemp)"
          npx tsx scripts/create-invite.ts --env=dev --apply > "$out"
          code="$(sed -n "s/^Code d'invitation.*: \([0-9a-f]\{32\}\)$/\1/p" "$out")"
          test -n "$code" || { echo "code introuvable dans la sortie"; exit 1; }
          echo "::add-mask::$code"
          {
            echo "### Code d'invitation (dev, usage unique)"
            echo
            echo "\`$code\`"
            echo
            echo "A transmettre au parent. Il ne sera plus affiche nulle part: supprime ce run apres usage."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$out"
