name: setup
description: Node 22 + installation des dependances (cache npm). Utilise par les jobs de ci.yml.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          package-lock.json
          e2e/package-lock.json
    - shell: bash
      run: npm ci
