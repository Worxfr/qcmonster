              example: { revisionId: 01JEXAMPLE0REV0000000000AA, coursId: 01JEXAMPLE0CRS0000000000AA, etat: en_cours, etape: verification, fiches: [{ docId: 01JEXAMPLE0DOC0000000000AA, etat: en_cours, numerosRestants: 70 }], createdAt: '2026-12-01T10:05:00Z' }
