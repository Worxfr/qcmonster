              schema: { $ref: '#/components/schemas/FamilyExport' }
              example: { familyId: 01JEXAMPLE0FAM0000000000AA, exportedAt: '2026-12-01T10:00:00Z', parentEmail: parent@example.invalid, students: [], docs: [], reports: [] }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/export/archive:
    post:
      operationId: createMyExportArchive
      tags: [game]
      summary: "L'eleve demande l'archive de TOUTES ses donnees, figures comprises (contract-v1.5.1, R1; handler me-export)"
      description: |
        Reserve a l'eleve (un parent recoit 403: l'export du parent ne contient aucun contenu de cours). Pas de corps. La construction est **asynchrone**: la reponse est `202` avec un `exportId`, puis `GET /me/export/archive/{exportId}` donne l'etat et, quand l'archive est prete, un lien signe de 10 minutes.
        Contenu du zip: `export.json` (profil, dossiers, cours avec texte, blocs et sections, fiches avec affirmations, sources, resume, paragraphes et rappel), `tests/<studentId>.jsonl` (historique des tests AVEC les reponses donnees) et `figures/<coursId>/<figureId>.jpg`. Le zip est ecrit en flux et ne depasse pas 150 Mo de figures: au-dela, les cours les plus anciens perdent leurs images (le texte reste complet), `truncated` vaut vrai et `omittedCourses` donne leur nombre.
        Limite: 3 demandes par heure et par eleve (429 `quota_epuise`). La demande et son lien expirent apres 1 jour (`GET` renvoie alors 404); le fichier est supprime par la regle d'expiration du stockage (1 a 2 jours) et avec l'eleve.
      responses:
        '202':
          description: Demande acceptee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportStatus' }
              example: { exportId: 01JF5EXP0RT00000000000AAAA, state: en_cours }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: "Plus de 3 demandes dans l'heure (`quota_epuise`), ou limite de debit de la route (corps API Gateway)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: quota_epuise, message: "Trop d'archives demandées, réessaie dans une heure" } } }
  /me/export/archive/{exportId}:
    get:
      operationId: getMyExportArchive
      tags: [game]
      summary: "Etat d'une archive de l'eleve; le lien signe est re-signe a chaque lecture (contract-v1.5.1, R1; handler me-export)"
      description: "Eleve seulement, et seulement SES demandes (404 sinon, y compris pour l'`exportId` d'un autre eleve). `state`: `en_cours`, `pret` (avec `archive`) ou `echec` (relancer une demande)."
      parameters:
        - { name: exportId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        '200':
          description: Etat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportStatus' }
              example: { exportId: 01JF5EXP0RT00000000000AAAA, state: pret, archive: { url: 'https://example.invalid/exports/archive.zip?signature=exemple', expiresAt: '2026-12-01T10:10:00Z', format: zip, sizeBytes: 48211300, students: 1, tests: 120, truncated: false, courses: 12, figures: 31, omittedCourses: 0 } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /family/export/archive:
    post:
      operationId: createExportArchive
      tags: [family]
      summary: "Archive telechargeable de l'export, avec tout l'historique des tests (contract-v1.4, H1; handler family-export-archive)"
      description: |
        Reserve au parent. Construit une archive **zip** et renvoie un **lien de telechargement court** (10 minutes). Contenu: `export.json` (meme forme que `GET /family/export`, mais `docs[].questions` ne garde que `questionId` et `kind`), et pour chaque eleve `tests/<studentId>.jsonl` (un passage par ligne, schema `TestParentDetail`, toutes les annees scolaires).
        Comme l'export JSON: **aucun texte de cours**, et ni texte de question, ni choix, ni bonne reponse. Les reponses donnees par l'eleve (`choice`) ne sont **pas** dans l'archive (l'eleve seul les lit dans l'application).
        Le lien ne porte aucune donnee: c'est une URL signee vers un fichier prive, valable 10 minutes. Le fichier est supprime par une regle d'expiration du stockage au plus tard 2 jours apres (et avec la famille).
        Limite: 3 archives par heure et par famille (429 `quota_epuise`). Borne: 50 000 passages au plus par archive (environ 9 ans pour 5 eleves a 3 passages par jour); au-dela, les annees scolaires les plus anciennes sont omises et `truncated` vaut vrai.
      responses:
        '200':
          description: Archive prete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportArchive' }
              example: { url: 'https://example.invalid/exports/archive.zip?signature=exemple', expiresAt: '2026-12-01T10:10:00Z', format: zip, sizeBytes: 482113, students: 2, tests: 1840, truncated: false }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: "Plus de 3 archives dans l'heure pour la famille (`quota_epuise`), ou limite de debit de la route (corps API Gateway, voir `TooManyRequests`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: quota_epuise, message: "Trop d'archives demandées, réessaie dans une heure" } } }
  /family/policy:
    post:
      operationId: acceptPolicy
      tags: [family]
      summary: "Le parent accepte la version en vigueur de la politique de confidentialite (contract-v1.4.1, handler family-create)"
      description: |
        Reserve au parent qui a deja une famille. Meme corps que `POST /family`: `consent` vrai et `policyVersion` egale a la version en vigueur, sinon 400 `requete_invalide` « Consentement requis ». Enregistre la date et la version dans la famille. Repondre deux fois est sans effet (204). Un eleve recoit 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyCreateRequest' }
            example: { consent: true, policyVersion: '2026-11-28' }
      responses:
        '204': { description: Accepte (policyOutdated repasse a faux) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /family:
    post:
      operationId: createFamily
      tags: [family]
      summary: Premiere connexion d'un parent invite - cree la famille, pose famille_id et le groupe parent. Le jeton deja emis ne les contient pas, le front se reconnecte (handler family-create, L3). Exige le consentement explicite du parent a la politique de confidentialite (date et version enregistrees).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyCreateRequest' }
            example: { consent: true, policyVersion: '2026-11-28' }
      responses:
        '201':
          description: Famille creee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example: { userId: 7b0f6c1e-0000-4000-8000-00000000a002, role: parent, familyId: 01JEXAMPLE0FAM0000000000AA }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteFamily
      tags: [family]
      summary: Suppression complete de la famille (handler family-admin, L3)
      responses:
        '204': { description: Famille supprimee }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/invitations:
    post:
      operationId: createInvitation
      tags: [admin]
      summary: Cree un code d'invitation parent a usage unique (handler admin-invitations, A1). Reserve aux comptes du groupe Cognito `admin`.
      description: |
        Autorisation cote serveur: le jeton doit porter le groupe `admin` (`cognito:groups`), sinon **403 `interdit`** (meme reponse pour un parent, un eleve ou un jeton sans groupe).
        Le code (128 bits, 32 caracteres hexadecimaux) n'est renvoye **qu'une fois**, dans cette reponse: seul son hache est stocke et il n'est jamais journalise.
        Limite: 20 codes par jour (UTC) et par administrateur, au-dela **429 `quota_epuise`**. Pas de corps de requete.
      responses:
        '201':
          description: Code cree (a transmettre au parent, non reaffichable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
              example: { code: 0123456789abcdef0123456789abcdef, createdAt: '2026-12-01T09:00:00.000Z', remainingToday: 19 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: Limite quotidienne de codes atteinte
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: quota_epuise, message: Limite de 20 codes par jour atteinte } } }
  /docs/{docId}/exercices:
    get:
      operationId: listExercices
      tags: [exercices]
      summary: Exercices de la fiche et points deja gagnes (eleve seul; handler exo-list, E1)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: Exercices de la fiche (5 au plus)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciceList' }
              example: { items: [{ exoId: 01JEXAMPLE0DOC0000000000AA-01, titre: Vitesse moyenne, etat: prete, points: 10, meilleurMilli: 600, xpPaye: 6, solutionVue: false }] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createExercice
      tags: [exercices]
      summary: Demande un exercice (generation asynchrone; handler exo-post, E1)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '202':
          description: Generation lancee; l'ecran interroge `GET /exercices/{exoId}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciceCreated' }
              example: { exoId: 01JEXAMPLE0DOC0000000000AA-01, etat: generation }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`matiere_non_prevue`, `plafond_exercices`, `fiche_trop_courte` ou `etat_invalide`"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: matiere_non_prevue, message: "Les exercices existent pour les maths et la physique-chimie" } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /exercices/{exoId}:
    get:
      operationId: getExercice
      tags: [exercices]
      summary: Enonce, avancement et indices deja vus; jamais le bareme, les attendus ni la solution (handler exo-get, E1)
      parameters: [{ $ref: '#/components/parameters/ExoId' }]
      responses:
        '200':
          description: Exercice (l'enonce est absent tant que `etat` = `generation` ou `echec`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercice' }
              example: { exoId: 01JEXAMPLE0DOC0000000000AA-01, docId: 01JEXAMPLE0DOC0000000000AA, etat: prete, titre: Vitesse moyenne, enonce: 'Un cycliste roule 30 km en 1,5 h. Calcule sa vitesse moyenne en $\\mathrm{km/h}$.', points: 10, indicesVus: 0, indicesTotal: 3, indicesDonnes: [], nbCopies: 0, copiesRestantes: 3, solutionVue: false }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /exercices/{exoId}/indice:
    post:
      operationId: getExerciceHint
      tags: [exercices]
      summary: Indice suivant (1, 2 puis 3); chaque indice retire 20 % des points (handler exo-hint-post, E1)
      parameters: [{ $ref: '#/components/parameters/ExoId' }]
      responses:
        '200':
          description: Indice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciceHint' }
              example: { rang: 1, texte: "Pense a la formule qui relie distance et duree.", indicesRestants: 2 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /exercices/{exoId}/solution:
    post:
      operationId: getExerciceSolution
      tags: [exercices]
      summary: Solution redigee; ferme les points de l'exercice (handler exo-solution-post, E1)
      parameters: [{ $ref: '#/components/parameters/ExoId' }]
      responses:
        '200':
          description: Solution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciceSolution' }
              example: { solution: 'On utilise $v = d / t$, donc $v = 30 / 1{,}5 = 20$ km/h.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`pas_encore`: ni correction, ni 3 indices suivis de 10 minutes"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: pas_encore, message: "Essaie d'abord l'exercice" } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /exercices/{exoId}/copies:
    post:
      operationId: createCopie
      tags: [exercices]
      summary: Ouvre une copie et renvoie des envois pre-signes, une page par envoi (handler copies-create, E1)
      parameters: [{ $ref: '#/components/parameters/ExoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopieCreateRequest' }
            example: { pages: 2, contentType: image/jpeg }
      responses:
        '201':
          description: "Copie `a_envoyer`. Une seule par eleve, en ouvrir une nouvelle remplace l'ancienne."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopieCreateResponse' }
              example:
                copieId: 01JEXAMPLE0COPIE00000000AA
                envois: [{ page: 1, url: 'https://qcm-dev-scans.s3.eu-west-3.amazonaws.com/', fields: { key: copies/01JEXAMPLE0STU0000000000AA/01JEXAMPLE0COPIE00000000AA/p1, Content-Type: image/jpeg } }]
                expireA: '2026-12-01T10:10:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`trop_tot`, `deja_en_cours`, `quota_copies`, `plafond_copies`"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: plafond_copies, message: "Tu as deja rendu cet exercice 3 fois" } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /copies/{copieId}/submit:
    post:
      operationId: submitCopie
      tags: [exercices]
      summary: "Lance la correction. Aucun corps: le serveur calcule lui-meme l'empreinte des pages (handler copies-submit, E1)"
      parameters: [{ $ref: '#/components/parameters/CopieId' }]
      responses:
        '202':
          description: Correction lancee; l'ecran interroge `GET /copies/{copieId}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopieSubmitResponse' }
              example: { etat: en_correction }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`trop_tot`, `deja_en_cours`, `quota_copies`, `plafond_copies` ou `etat_invalide`"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: trop_tot, message: "Prends le temps de faire l'exercice" } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /copies/{copieId}:
    get:
      operationId: getCopie
      tags: [exercices]
      summary: Etat et retour de la correction; credite les points a la premiere lecture d'une copie corrigee (idempotent; handler copie-get, E1)
      parameters: [{ $ref: '#/components/parameters/CopieId' }]
      responses:
        '200':
          description: Copie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Copie' }
              example:
                copieId: 01JEXAMPLE0COPIE00000000AA
                exoId: 01JEXAMPLE0DOC0000000000AA-01
                etat: corrigee
                etapes: [{ id: e1, libelle: Choisir la formule, statut: ok, indice: "Bien vu." }, { id: e2, libelle: Calculer, statut: faux, indice: "Relis ton calcul de la division." }]
                finale: { libelle: Vitesse moyenne, statut: fausse }
                scoreMilli: 600
                bilan: 1 etape sur 2
                xpGagne: 6
                solutionVue: false
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteCopie
      tags: [exercices]
      summary: Supprime la copie et son retour (handler copie-delete, E1)
      parameters: [{ $ref: '#/components/parameters/CopieId' }]
      responses:
        '204': { description: Copie supprimee }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`en_correction`: la correction tourne encore"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: en_correction, message: "La correction est en cours" } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /docs/{docId}/shareable:
    get:
      operationId: getShareableQuestions
      tags: [shares]
      summary: "Questions de la fiche que l'eleve peut partager (handler shares-shareable, S1 #34, v1.12). Eleve seulement."
      description: |
        Seules les questions partageables portent leur enonce, leurs choix et leur reponse (`answer` ou `expected`): une question jamais reussie (`reason: a_jouer`) est renvoyee sans enonce ni reponse, pour ne pas lire la cle avant de jouer.
        Partageable = deja payee (`rewarded`), ou toute la fiche si elle a atteint ses 50 points. `reason`: `a_jouer`, `donnee_personnelle` (le filtre de donnees personnelles la refuse) ou `retiree` (retiree par une modification du cours).
        Reponse `403` si le parent n'a pas active le partage pour cet eleve.
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: Questions de la fiche
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareableList' }
              example:
                questions:
                  - { questionId: 01JEXAMPLE0DOC0000000000AA:qcm:01, kind: qcm, prompt: "Ou se deroule la photosynthese ?", choices: [Les mitochondries, Les chloroplastes, Le noyau, Les ribosomes], answer: 1, shareable: true }
                  - { questionId: 01JEXAMPLE0DOC0000000000AA:gap:01, kind: gap, prompt: "La photosynthese produit du ___.", expected: dioxygene, shareable: true }
                  - { questionId: 01JEXAMPLE0DOC0000000000AA:qcm:02, kind: qcm, shareable: false, reason: a_jouer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/shares:
    get:
      operationId: listMyShares
      tags: [shares]
      summary: "Liens de partage de l'eleve (handler shares-list, S1 #34, v1.12). Jamais le lien lui-meme."
      responses:
        '200':
          description: Liens de l'eleve (5 au plus actifs)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyShareList' }
              example: { shares: [{ shareId: 01JEXAMPLE0SHR0000000000AA, title: Photosynthese, count: 8, createdAt: '2026-12-01T10:00:00Z', expiresAt: '2026-12-08T10:00:00Z', state: actif, reads: 3, reports: 0, outdated: false }] }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createShare
      tags: [shares]
      summary: "Cree un lien de partage: copie figee de 5 a 20 questions d'une fiche (handler shares-create, S1 #34, v1.12). Eleve seulement, partage active par le parent."
      description: |
        Le jeton (`token`) n'est renvoye qu'ici: seul son hache est conserve, il ne se relit jamais. Le lien a donner est `<site>/p#t=<token>` (dans le fragment, jamais dans le chemin).
        Erreurs: `403` (partage coupe pour cet eleve, ou eleve suspendu), `404` (fiche inconnue), `400 titre_refuse` (le titre contient une donnee personnelle ou un mot refuse), `409 questions_non_partageables`, `429 plafond_partages` (5 liens actifs par eleve, 10 par famille, 10 creations par jour et par eleve).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCreateRequest' }
            example: { docId: 01JEXAMPLE0DOC0000000000AA, questionIds: ['01JEXAMPLE0DOC0000000000AA:qcm:01', '01JEXAMPLE0DOC0000000000AA:qcm:03', '01JEXAMPLE0DOC0000000000AA:qcm:04', '01JEXAMPLE0DOC0000000000AA:gap:01', '01JEXAMPLE0DOC0000000000AA:gap:02'], title: Photosynthese, ttlDays: 7 }
      responses:
        '201':
          description: Lien cree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCreated' }
              example: { shareId: 01JEXAMPLE0SHR0000000000AA, token: AbCdEfGhIjKlMnOpQrStUv, expiresAt: '2026-12-08T10:00:00Z' }
        '400':
          description: "Requete invalide (`requete_invalide`) ou titre refuse (`titre_refuse`, message neutre, le mot n'est jamais nomme)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: titre_refuse, message: "Ce titre n'est pas possible, essaie-en un autre" } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`questions_non_partageables`: une question n'est pas partageable (pas encore jouee, retiree ou refusee par le filtre)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: questions_non_partageables, message: "Certaines questions ne peuvent pas etre partagees" } } }
        '429':
          description: "`plafond_partages`: trop de liens actifs ou de creations aujourd'hui"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: plafond_partages, message: "Tu as deja trop de liens, supprime-en un" } } }
  /me/shares/{shareId}:
    delete:
      operationId: deleteMyShare
      tags: [shares]
      summary: "Revoque un lien de l'eleve (handler shares-delete, S1 #34, v1.12). Effet immediat."
      parameters: [{ $ref: '#/components/parameters/ShareId' }]
      responses:
        '204': { description: Revoque }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: "Lien inconnu ou d'un autre eleve (indiscernable)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: introuvable, message: Introuvable } } }
  /students/{sid}/shares:
    get:
      operationId: listStudentShares
      tags: [shares]
      summary: "Le parent voit les liens d'un eleve, sans les questions ni le lien (handler shares-parent-list, S1 #34, v1.12)"
      parameters: [{ $ref: '#/components/parameters/StudentId' }]
      responses:
        '200':
          description: "Liens de l'eleve. `purgePending`: le partage est coupe mais des liens restent (la suppression n'est pas finie: la rejouer avec `DELETE`)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentShareList' }
              example: { shares: [{ shareId: 01JEXAMPLE0SHR0000000000AA, title: Photosynthese, count: 8, createdAt: '2026-12-01T10:00:00Z', expiresAt: '2026-12-08T10:00:00Z', state: suspendu, reads: 12, reports: 3 }], purgePending: false }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteStudentShares
      tags: [shares]
      summary: "Le parent supprime tous les liens d'un eleve (handler shares-parent-delete, S1 #34, v1.12). Idempotent, rejouable."
      description: |
        Sert a la coupure du partage: le site appelle d'abord `PATCH /students/{sid}` avec `sharing: false` (le drapeau, creation refusee tout de suite), puis cette route. Les copies sont supprimees avant les references; un rejeu apres un echec ne fait que finir le travail.
      parameters: [{ $ref: '#/components/parameters/StudentId' }]
      responses:
        '204': { description: "Tous les liens de l'eleve sont supprimes (aucun lien: 204 aussi)" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{sid}/shares/{shareId}:
    delete:
      operationId: deleteStudentShare
      tags: [shares]
      summary: "Le parent revoque un lien d'un eleve (handler shares-parent-delete, S1 #34, v1.12)"
      parameters: [{ $ref: '#/components/parameters/StudentId' }, { $ref: '#/components/parameters/ShareId' }]
      responses:
        '204': { description: Revoque }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shares/open:
    post:
      operationId: openShare
      tags: [shares]
      summary: "Le destinataire ouvre un QCM partage. Route PUBLIQUE, sans JWT (handler shares-open, S1 #34, v1.12)"
      description: |
        Le jeton est dans le corps, jamais dans le chemin ni l'URL (les journaux d'acces n'ont pas les corps). Reponse unique `404 lien_indisponible` pour un jeton mal forme, inconnu, expire, revoque, suspendu ou dont le plafond de lectures du jour est atteint.
        Reponse `Cache-Control: no-store`. Aucun identifiant de fiche, d'eleve ou de famille. Le destinataire ne gagne aucun point et rien n'est enregistre de ses reponses.
        Fermee par defaut (`SHARE_PUBLIC_ENABLED` a `false`): meme `404`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareOpenRequest' }
            example: { token: AbCdEfGhIjKlMnOpQrStUv }
      responses:
        '200':
          description: Copie figee du QCM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedQuiz' }
              example:
                title: Photosynthese
                subject: svt
                questions:
                  - { kind: qcm, prompt: "Ou se deroule la photosynthese ?", choices: [Les mitochondries, Les chloroplastes, Le noyau, Les ribosomes], answer: 1 }
                  - { kind: gap, prompt: "La photosynthese produit du ___.", expected: dioxygene }
                  - { kind: qcm, prompt: "Quelle energie la plante utilise-t-elle ?", choices: [Chimique, Lumineuse, Thermique, Nucleaire], answer: 1 }
                  - { kind: qcm, prompt: "Quel gaz la plante absorbe-t-elle ?", choices: [Le dioxygene, Le diazote, Le dioxyde de carbone, L'argon], answer: 2 }
                  - { kind: gap, prompt: "Les chloroplastes contiennent de la ___.", expected: chlorophylle }
                expiresAt: '2026-12-08T10:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: "`lien_indisponible`: reponse unique pour tout lien inutilisable"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: lien_indisponible, message: "Ce lien n'est plus disponible" } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /shares/report:
    post:
      operationId: reportShare
      tags: [shares]
      summary: "Le destinataire signale un QCM partage. Route PUBLIQUE, sans JWT (handler shares-report, S1 #34, v1.12)"
      description: |
        Motif dans une liste fermee, aucun texte libre, aucune adresse ni identifiant du signaleur n'est conserve. A 3 signalements le lien est suspendu. Meme `404 lien_indisponible` unique que `POST /shares/open`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareReportRequest' }
            example: { token: AbCdEfGhIjKlMnOpQrStUv, reason: inapproprie }
      responses:
        '204': { description: Signalement enregistre }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: "`lien_indisponible`"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: lien_indisponible, message: "Ce lien n'est plus disponible" } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ScanId: { name: scanId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    DocId: { name: docId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    CoursId: { name: coursId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    RevisionId: { name: revisionId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    FolderId: { name: folderId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    ExoId: { name: exoId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    ShareId: { name: shareId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    CopieId: { name: copieId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    TestId: { name: testId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    SchoolYear: { name: schoolYear, in: query, required: false, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{4}$' }, description: "Annee scolaire (1er septembre au 31 aout, Europe/Paris), ex. 2026-2027" }
    TestLimit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    TestCursor: { name: cursor, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 512 }, description: "Curseur opaque renvoye par la page precedente (`nextCursor`)" }
    StudentId: { name: sid, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
  responses:
    BadRequest:
      description: Requete invalide
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: requete_invalide, message: Champ manquant } } }
    Forbidden:
      description: Role insuffisant
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: interdit, message: Reserve au parent } } }
    NotFound:
      description: Introuvable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: introuvable, message: Introuvable } } }
    TooManyRequests:
      description: "Limite de debit de la route depassee (la limite est globale a la route, voir infra). Le client reessaie apres quelques secondes, en espacant son interrogation. Corps produit par API Gateway, pas par le contrat Error."
      content: { application/json: { schema: { type: object, properties: { message: { type: string } } }, example: { message: Too Many Requests } } }
    NamePris:
      description: "Surnom deja pris dans la famille (`pseudo_pris`) ou etat incompatible (`etat_invalide`)"
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: pseudo_pris, message: "Ce surnom est déjà pris dans ta famille, essaie-en un autre" } } }
    Conflict:
      description: Etat incompatible
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: etat_invalide, message: Le job n'est pas a confirmer } } }
    QuotaExceeded:
      description: "quota_epuise (pages du mois) ou budget_epuise (compteur de cout: seuils mensuels 15/18 EUR en prod, 95/100 EUR en dev; en dev, plafond d'essais cumule DEV_TRIAL_CAP_EUR = 100 EUR)"
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: quota_epuise, message: Quota de pages epuise, resetDate: '2027-01-01' } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [requete_invalide, interdit, introuvable, etat_invalide, quota_epuise, budget_epuise, dossier_nom_pris, dossiers_limite, indisponible, cours_plein, aucune_question, pseudo_refuse, pseudo_pris, matiere_non_prevue, plafond_exercices, fiche_trop_courte, pas_encore, trop_tot, deja_en_cours, quota_copies, plafond_copies, copie_deja_rendue, solution_vue, en_correction, fiche_trop_revisee, plafond_revisions, titre_refuse, questions_non_partageables, plafond_partages, lien_indisponible], description: "S1 #34 (1.12.0): `titre_refuse` (400): le titre d'un partage contient une donnee personnelle ou un mot refuse (message neutre); `questions_non_partageables` (409): une question choisie n'est pas partageable; `plafond_partages` (429): 5 liens actifs par eleve, 10 par famille ou 10 creations par jour; `lien_indisponible` (404, routes publiques): reponse unique pour tout lien inutilisable. M1 #90 (1.11.0): `fiche_trop_revisee` (409): la fiche a epuise ses numeros de questions ou d'affirmations, la supprimer et rescanner; `plafond_revisions` (429): 1 modification par cours et par jour, 2 par eleve et par jour, ou plafond mensuel de cout atteint (0,50 EUR par eleve, 1,50 EUR par famille). E1 (1.9.0, tous 409 sauf mention): `matiere_non_prevue` (maths et physique seulement), `plafond_exercices` (5 par fiche, 1 generation par fiche et par jour, 5 par jour), `fiche_trop_courte` (moins de 2 affirmations verifiees), `pas_encore` (solution pas encore disponible), `trop_tot` (copie rendue moins de 60 s apres l'ouverture), `deja_en_cours` (une correction a la fois), `quota_copies` (40 pages par mois, `resetDate`), `plafond_copies` (3 corrections par exercice, 5 par jour), `copie_deja_rendue` (etat `echec` d'une copie dont une page a deja ete corrigee), `solution_vue` (copie sans points), `en_correction` (suppression refusee pendant la correction). `pseudo_refuse` (400, ajoute en 1.8.0): surnom refuse (forme, mot de la liste, donnee personnelle); message neutre, le mot n'est jamais nomme. `pseudo_pris` (409, ajoute en 1.8.0): surnom deja porte par un autre eleve de la famille. `aucune_question` (409, ajoute en 1.7.0): `POST /practice/session` sans aucune question disponible. `cours_plein` (409, ajoute en 1.6.0): le cours depasserait 30 pages ou 20 sections; un client ancien lit le statut HTTP. `indisponible` (503, ajoute en 1.5.1): erreur de stockage reessayable, l'etat n'a pas change (confirmation avec figures). `dossier_nom_pris` (409) et `dossiers_limite` (400) ajoutes en 1.3 pour les dossiers; un client 1.2 qui ne les connait pas lit le statut HTTP." }
        message: { type: string, maxLength: 500 }
        resetDate: { type: string, format: date, description: Remise a zero du quota (1er du mois a Paris) }
    JobState:
      type: string
      enum: [en_attente_envoi, verification_fichier, transcription, a_confirmer, verification, generation, termine, rejete, echec, expire]
    Job:
      type: object
      required: [jobId, state, pages, createdAt]
      properties:
        jobId: { type: string }
        state: { $ref: '#/components/schemas/JobState' }
        pages: { type: integer, minimum: 1, maximum: 10 }
        createdAt: { type: string, format: date-time }
        durationSeconds: { type: integer, minimum: 0 }
        costCents: { type: integer, minimum: 0, description: Cout Bedrock du traitement en centimes d'euro (mesure, pas estime) }
        docId: { type: string, description: Present quand state = termine }
        message: { type: string, maxLength: 500 }
        status: { $ref: '#/components/schemas/ScanStatus' }
        docIds: { type: array, maxItems: 6, items: { type: string }, description: "Fiches du scan, dans l'ordre des sections (v1.3). `docId` = la premiere. Present quand state = termine." }
        coursId: { type: string, description: "Facultatif (v1.6): cours auquel ce scan appartient. Pour un ajout de pages, le cours auquel on ajoute (present des la creation); pour un scan ordinaire, present apres la confirmation." }
    Subject:
      type: string
      enum: [maths, physique, svt, histoire_geo, francais, autre]
      description: "Matiere (liste fermee). Libelles affiches: Maths, Physique-chimie, SVT, Histoire-geo, Francais, Autre. Les identifiants `physique` et `histoire_geo` sont ceux de la v1 (donnees existantes)."
    Topic:
      type: string
      minLength: 1
      maxLength: 80
      description: "Sujet en texte libre court (ex. La Revolution francaise). Propose par la lecture du cours, modifiable par l'eleve. Espaces de debut et de fin retires; pas de balises."
    ScanStage:
      type: string
      enum: [envoi, lecture, a_confirmer, fiche, verification, qcm, termine, echec]
      description: |
        Etape du traitement, dans l'ordre. Correspondance avec `Job.state`: en_attente_envoi=envoi; verification_fichier et transcription=lecture; a_confirmer=a_confirmer;
        verification=fiche puis verification (le traitement ecrit l'etape fine; a defaut `verification`); generation=qcm; termine=termine; rejete, echec et expire=echec (le detail reste dans `Job.state`).
    ScanStatus:
      type: object
      required: [stage, pagesDone, pagesTotal, startedAt]
      properties:
        stage: { $ref: '#/components/schemas/ScanStage' }
        pagesDone: { type: integer, minimum: 0, description: "Pages recues (envoi) ou lues (lecture); egal a pagesTotal aux etapes suivantes" }
        pagesTotal: { type: integer, minimum: 1, maximum: 10 }
        startedAt: { type: string, format: date-time, description: Creation du scan }
        finishedAt: { type: string, format: date-time, description: Present aux etapes termine et echec }
        expiresAt: { type: string, format: date-time, description: "A l'etape a_confirmer seulement: heure ou le scan expire (photo supprimee, pages rendues) si l'eleve ne confirme pas. Absent pour un scan cree avant 1.3." }
        expiresSoon: { type: boolean, description: "Vrai quand il reste 2 h ou moins avant `expiresAt` (calcule par le serveur). Present avec `expiresAt`." }
        message: { type: string, maxLength: 500, description: "Message lisible pour l'eleve, present a l'etape echec (ex. Le texte est trop court pour faire une fiche)" }
    ScanSummary:
      type: object
      required: [scanId, studentId, state, pages, createdAt, status]
      properties:
        state: { $ref: '#/components/schemas/JobState', description: "Etat precis du job (distingue rejete, echec, expire). Un job annule par l eleve n est pas liste. Une fiche dont le job a expire est `termine`." }
        scanId: { type: string, description: "= jobId. Pour une fiche ancienne dont le job a expire: jobId de la fiche, ou docId si elle n'en a pas" }
        studentId: { type: string }
        docId: { type: string, description: Present quand la fiche existe (etape termine) }
        title: { type: string, maxLength: 200 }
        subject: { $ref: '#/components/schemas/Subject' }
        topic: { $ref: '#/components/schemas/Topic' }
        folderId: { type: string }
        pages: { type: integer, minimum: 1, maximum: 10, description: "Pages du SCAN (pas de la fiche): un scan decoupe en 3 fiches repete la meme valeur sur chaque fiche; ne pas les additionner (regrouper par scanId)." }
        createdAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ScanStatus' }
        coursId: { type: string, description: "Cours complet conserve (v1.3), present des la confirmation" }
        sectionIndex: { type: integer, minimum: 0, maximum: 5, description: "Rang de la fiche dans son scan (0 = premiere). Un scan decoupe en plusieurs fiches donne UNE entree par fiche, avec le meme `scanId`, `sectionCount` et `docIds`; le client regroupe par `scanId`. Absent pour un scan en cours ou a une seule fiche ancienne." }
        sectionCount: { type: integer, minimum: 1, maximum: 6, description: "Nombre de fiches du scan" }
        docIds: { type: array, maxItems: 6, items: { type: string }, description: "Toutes les fiches du scan (v1.3), dans l'ordre; `docId` est celle de cette entree" }
    ScanList:
      type: object
      required: [items, inProgress, toReview, facets]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ScanSummary' } }
        nextCursor: { type: string, maxLength: 200 }
        inProgress: { type: integer, minimum: 0, description: "Scans non termines ni en echec (tous, sans filtre): sert a savoir s'il faut continuer d'interroger" }
        toReview: { type: integer, minimum: 0, description: "Scans a l'etape a_confirmer (tous, sans filtre): « a relire », pour l'accueil" }
        facets:
          type: object
          required: [subjects, topics]
          properties:
            subjects:
              type: array
              items: { type: object, required: [subject, count], properties: { subject: { $ref: '#/components/schemas/Subject' }, count: { type: integer, minimum: 1 } } }
            topics:
              type: array
              description: Sujets distincts (un seul libelle par sujet normalise), du plus frequent au moins frequent, 100 au plus
              maxItems: 100
              items: { type: object, required: [topic, count], properties: { topic: { $ref: '#/components/schemas/Topic' }, count: { type: integer, minimum: 1 } } }
    CoursMeta:
      type: object
      required: [coursId, createdAt, pages, sections]
      description: "Cours conserve SANS son texte: structure, sections et liens vers les fiches (c'est ce que contient l'export)."
      properties:
        coursId: { type: string }
        createdAt: { type: string, format: date-time }
        pages: { type: integer, minimum: 1, maximum: 30, description: "Pages du cours (30 au plus depuis la v1.6: un cours peut recevoir des ajouts de pages)" }
        figureCount: { type: integer, minimum: 0, maximum: 24, description: "Facultatif (v1.5): nombre de figures conservees. Les images ne sont jamais dans l'export parent." }
        sections:
          type: array
          maxItems: 20
          description: "20 sections au plus depuis la v1.6 (6 par scan, plusieurs scans par cours). Les sections d'un ajout suivent celles du cours d'origine."
          items:
            type: object
            required: [fromSentenceId, subject, status]
            properties:
              fromSentenceId: { type: string, pattern: '^p[0-9]+-s[0-9]+$' }
              subject: { $ref: '#/components/schemas/Subject' }
              topic: { $ref: '#/components/schemas/Topic' }
              title: { type: string, maxLength: 200 }
              folderId: { type: string }
              status: { type: string, enum: [fiche, ignoree, sans_fiche, supprimee], description: "fiche = une fiche existe (`docId`); ignoree = `ignore: true`; sans_fiche = aucune affirmation exploitable dans cette section; supprimee = la fiche a ete supprimee" }
              docId: { type: string, description: "Present si status = fiche" }
    Cours:
      description: "Cours complet corrige, conserve jusqu'a suppression par l'eleve (le parent supprime par le compte de l'eleve) et avec le compte, comme les fiches. Contient le texte lu et corrige, jamais la photo. Lu par l'eleve seulement (`GET /cours/{coursId}`); l'export parent n'a que `CoursMeta`."
      allOf:
        - $ref: '#/components/schemas/CoursMeta'
        - type: object
          required: [texts]
          properties:
            texts:
              type: array
              description: "Une entree par page, triee numeriquement; meme forme que `Transcription.pages`"
              items:
                type: object
                required: [page, sentences]
                properties:
                  page: { type: integer, minimum: 1 }
                  sentences: { type: array, items: { $ref: '#/components/schemas/Sentence' } }
            blocks:
              type: array
              maxItems: 1200
              items: { $ref: '#/components/schemas/Block' }
              description: "Facultatif (v1.5): mise en forme conservee. Absent pour un cours ancien: l'ecran affiche les phrases."
            figures:
              type: array
              maxItems: 24
              items: { $ref: '#/components/schemas/Figure' }
              description: "Facultatif (v1.5): figures conservees, avec `url` pre-signee de 5 minutes (eleve seulement). Supprimees avec le cours."
            revision:
              type: object
              required: [revisionId, etat]
              properties:
                revisionId: { type: string }
                etat: { type: string, enum: [en_cours] }
              description: "Facultatif (v1.11): present tant qu'une modification du cours est ouverte (un autre appareil de l'eleve voit la banniere)."
            marks:
              type: array
              maxItems: 500
              items: { $ref: '#/components/schemas/SentenceMark' }
              description: "Facultatif (v1.5): resultat de la verification des sources, phrase par phrase, calcule a la lecture depuis les fiches liees (vide tant que la verification n'est pas finie; les fiches supprimees n'y figurent plus)."
    Folder:
      type: object
      required: [folderId, name, createdAt, scanCount]
      properties:
        folderId: { type: string }
        name: { type: string, minLength: 1, maxLength: 60 }
        createdAt: { type: string, format: date-time }
        scanCount: { type: integer, minimum: 0 }
    FolderList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Folder' } }
    FolderNameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: "Espaces de debut et de fin retires; non vide apres retrait" }
    FolderScansRequest:
      type: object
      required: [docIds]
      properties:
        docIds: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 64 } }
    DocUpdateRequest:
      type: object
      minProperties: 1
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        topic: { type: [string, 'null'], minLength: 1, maxLength: 80, description: "Sujet (voir Topic); null efface le sujet" }
    ConfirmSection:
      type: object
      required: [fromSentenceId, subject]
      properties:
        fromSentenceId: { type: string, pattern: '^(p[0-9]+-s[0-9]+|n[0-9]{1,2})$', description: "Premiere phrase de la section (identifiant de `Transcription`, ex. p2-s3; v1.10: ou la cle `n<k>` d'une phrase de `ConfirmRequest.added`). La section va jusqu'a la phrase qui precede la section suivante." }
        subject: { $ref: '#/components/schemas/Subject' }
        topic: { $ref: '#/components/schemas/Topic' }
        title: { type: string, minLength: 1, maxLength: 200, description: "Titre de la fiche; a defaut, propose par l'extraction" }
        folderId: { type: string, minLength: 1, maxLength: 64, description: "Dossier de la fiche (404 s'il n'existe pas)" }
        ignore: { type: boolean, description: "true: le texte est garde dans le cours, aucune fiche n'est creee (`subject` reste obligatoire pour l'uniformite, sans effet)." }
    SuggestedSection:
      type: object
      required: [fromSentenceId, subject]
      description: "Decoupage propose par la lecture du cours (une proposition par section possible), modifiable par l'eleve. Meme sens que ConfirmSection."
      properties:
        fromSentenceId: { type: string, pattern: '^p[0-9]+-s[0-9]+$' }
        subject: { $ref: '#/components/schemas/Subject' }
        topic: { $ref: '#/components/schemas/Topic' }
        title: { type: string, minLength: 1, maxLength: 200 }
    ScanCreateRequest:
      type: object
      required: [pages, contentType]
      properties:
        pages: { type: integer, minimum: 1, maximum: 10, description: "Nombre de pages de l'envoi (10 max). v1: une image = 1 page (PDF refuse, voir contentType)" }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf], description: "v1: seules les images (image/jpeg, image/png) sont acceptees. application/pdf est refuse (400 requete_invalide) tant que la prise en charge des PDF n'existe pas. Pour des pages de types differents, voir `contentTypes`." }
        contentTypes:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, enum: [image/jpeg, image/png] }
          description: "Facultatif (v1.3): type de chaque page, dans l'ordre. Doit avoir exactement `pages` elements, sinon 400. S'il est absent, toutes les pages ont `contentType`. S'il est present, il prime sur `contentType`."
        folderId: { type: string, minLength: 1, maxLength: 64, description: "Facultatif (v1.3): dossier de l'eleve ou ranger la fiche une fois creee. Dossier inconnu: 404, avant toute reservation de page." }
        coursId: { type: string, minLength: 1, maxLength: 64, description: "Facultatif (v1.6): cours existant de l'eleve auquel ajouter ces pages. Les pages sont numerotees a la suite et donnent de nouvelles sections et fiches (un ajout est un scan ordinaire). Inconnu ou d'un autre eleve: 404, avant toute reservation. Un seul ajout ouvert par cours." }
    UploadTarget:
      type: object
      required: [url, fields]
      properties:
        url: { type: string, format: uri }
        fields: { type: object, additionalProperties: { type: string } }
    ScanCreateResponse:
      type: object
      required: [jobId, upload, expiresAt, pagesRemaining]
      properties:
        jobId: { type: string }
        upload:
          deprecated: true
          description: "= uploads[0] (compatibilite v1.2). Un client v1.2 qui envoie plus d'une page n'a qu'une URL: son job expire et rend les pages."
          allOf: [{ $ref: '#/components/schemas/UploadTarget' }]
        uploads:
          type: array
          minItems: 1
          maxItems: 10
          description: "Une entree par page, dans l'ordre. Facultatif dans le schema pour que le contrat reste deployable avant le lot back FEAT-A; le client lit `uploads ?? [{ page: 1, ...upload }]`. Present dans toute reponse du lot back. La cle S3 de la page p est scans/<eleve>/<job>/<p-1> (fixee par l'URL: le client ne choisit pas la cle)."
          items:
            allOf:
              - $ref: '#/components/schemas/UploadTarget'
              - type: object
                required: [page]
                properties:
                  page: { type: integer, minimum: 1, maximum: 10 }
        expiresAt: { type: string, format: date-time }
        pagesRemaining: { type: integer, minimum: 0 }
    Sentence:
      type: object
      required: [id, text]
      properties:
        continuesId: { type: string, pattern: '^p[0-9]+-s[0-9]+$', description: "Facultatif (v1.6), `Transcription` seulement (ajout de pages): identifiant de la derniere phrase du cours que cette phrase prolonge (la premiere ligne de l'ajout continue la derniere phrase du cours). La phrase du cours n'est jamais recollee ni reecrite. Absent sinon." }
        doubt: { type: boolean, description: "Facultatif (v1.5), reponse seulement (`Transcription`), ignore dans `ConfirmRequest.corrections` et absent de `Cours`. true: la lecture de cette phrase est douteuse (ecriture illisible, mot incertain); l'ecran de relecture la signale. C'est une confiance de LECTURE donnee par le modele: ce n'est PAS un resultat de verification des faits (qui n'existe qu'apres la confirmation, voir `Cours.marks`). Absent = pas de doute signale." }
        added: { type: boolean, description: "Facultatif (v1.10), `Cours` seulement: true si l'eleve a ajoute cette phrase a la relecture (affichage « Ajoutee par toi »). Jamais dans `Transcription`, ignore dans `ConfirmRequest.corrections`." }
        id: { type: string, pattern: '^p[0-9]+-s[0-9]+$', description: "`p<page de depart>-s<n>`: l'identifiant porte la PREMIERE page de la phrase, meme si elle se termine plus loin." }
        text: { type: string, maxLength: 2000, description: "Texte de la phrase. Depuis la v1.5 il peut contenir du LaTeX: une formule dans une phrase est entouree de `$...$` (hors formule, `\\$` pour un dollar litteral et `\\\\` pour un antislash litteral); dans un bloc `formule`, le texte est le LaTeX sans delimiteurs. Le serveur controle le LaTeX (longueur, accolades, commandes interdites comme href, url, input, def) et laisse en texte simple ce qui ne passe pas; le site l'affiche en MathML via KaTeX (trust: false)." }
        pages:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: integer, minimum: 1, maximum: 30 }
          description: "Facultatif (v1.3). Pages d'origine d'une phrase recollee: une phrase coupee par un saut de page est UNE phrase, `pages: [2, 3]`. Pages consecutives, croissantes, la premiere = celle de l'id. Absent: la phrase tient sur la page de son id. La phrase n'est listee que sous sa premiere page dans `Transcription.pages`; la page suivante ne la repete pas. Dans `ConfirmRequest.corrections`, `pages` est ignore (seuls `id` et `text` comptent)."
    Block:
      type: object
      required: [id, kind]
      description: "Bloc de mise en forme du cours (v1.5), au-dessus des phrases: les phrases (`Sentence`) restent l'unite des corrections, des coupes en sections, des retraits et des affirmations verifiees; un bloc ne fait que les REGROUPER dans l'ordre du document. Un bloc peut s'etendre sur deux pages (phrase recollee, ou paragraphe qui continue)."
      properties:
        id: { type: string, pattern: '^b[0-9]+$', description: "b1, b2... dans l'ordre du document" }
        kind: { type: string, enum: [titre, paragraphe, liste, formule, figure], description: "titre: une phrase; paragraphe: une ou plusieurs phrases; liste: une phrase par element; formule: une phrase dont le texte est du LaTeX SANS delimiteurs (ex. `E = mc^{2}`); figure: aucune phrase, voir `figureId`" }
        level: { type: integer, minimum: 1, maximum: 3, description: "Titre seulement: 1 = titre du cours, 2 = partie, 3 = sous-partie" }
        ordered: { type: boolean, description: "Liste seulement: numerotee (true) ou a puces (defaut false)" }
        sentenceIds: { type: array, maxItems: 200, items: { type: string, pattern: '^p[0-9]+-s[0-9]+$' }, description: "Phrases du bloc, dans l'ordre. Absent pour une figure." }
        figureId: { type: string, pattern: '^f[0-9]+$', description: "Figure seulement" }
    FigureBox:
      type: object
      required: [x, y, w, h]
      description: "Cadre de la figure sur la page, en fractions de la largeur et de la hauteur (0 a 1), origine en haut a gauche"
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, minimum: 0, maximum: 1 }
        h: { type: number, minimum: 0, maximum: 1 }
    Figure:
      type: object
      required: [figureId, page, kind, alt, url]
      description: "Schema, graphique, tableau, carte ou photo du cours (v1.5). Une figure est TOUJOURS une image (`url`): jamais de figure en texte seul. `alt` (description courte ecrite par le modele) est le texte alternatif pour l'accessibilite, pas un substitut de l'image. Si le cadre propose est faux et ne se corrige pas, l'image est la page entiere (`box` absent). La figure et son `alt` ne sont JAMAIS des affirmations: ils ne sont ni verifies ni utilises pour les questions."
      properties:
        figureId: { type: string, pattern: '^f[0-9]+$' }
        page: { type: integer, minimum: 1, maximum: 30 }
        kind: { type: string, enum: [schema, graphique, tableau, carte, photo, autre] }
        alt: { type: string, minLength: 1, maxLength: 300 }
        caption: { type: string, maxLength: 200, description: "Legende ecrite sous la figure sur la page, recopiee, si elle existe" }
        box: { allOf: [{ $ref: '#/components/schemas/FigureBox' }], description: "Absent: la figure est la page entiere (cadre introuvable)" }
        url: { type: string, format: uri, description: "Image recadree (JPEG, 1200 px au plus), URL pre-signee de 5 minutes re-signee a chaque lecture." }
        urlExpireAt: { type: string, format: date-time }
    ConfirmFigure:
      type: object
      required: [figureId, keep]
      properties:
        figureId: { type: string, pattern: '^f[0-9]+$' }
        keep: { type: boolean, description: "true: le recadrage est conserve avec le cours. false: il est supprime avec la photo." }
        alt: { type: string, minLength: 1, maxLength: 300, description: "Texte alternatif corrige par l'eleve" }
    SentenceMark:
      type: object
      required: [sentenceId, status, docId, claimId]
      description: "Resultat de verification le plus severe parmi les affirmations tirees de cette phrase (erreur > non_verifiable > verifiee). Une phrase sans affirmation factuelle n'a pas de marque."
      properties:
        sentenceId: { type: string, pattern: '^p[0-9]+-s[0-9]+$' }
        status: { type: string, enum: [verifiee, erreur, non_verifiable] }
        docId: { type: string }
        claimId: { type: string }
    FicheParagraph:
      type: object
      required: [text]
      properties:
        heading: { type: string, maxLength: 120, description: "Intertitre facultatif" }
        text: { type: string, minLength: 1, maxLength: 1200 }
        claimIds: { type: array, maxItems: 20, items: { type: string }, description: "Affirmations (`Doc.claims`) sur lesquelles repose le paragraphe" }
    RecallItem:
      type: object
      required: [kind, text, claimId, verified]
      properties:
        kind: { type: string, enum: [date, formule, definition, nombre] }
        text: { type: string, minLength: 1, maxLength: 1000, description: "Texte de l'affirmation citee, COPIE par le serveur (le modele ne choisit que `claimId` et `kind`), jamais reecrit. Depuis la v1.5 le texte peut contenir du LaTeX (`$...$`), controle par le serveur et rendu par le site (voir `Sentence.text`)." }
        claimId: { type: string, description: "Affirmation d'ou vient l'element (`Doc.claims`)" }
        verified: { type: boolean, description: "true: l'affirmation est `verifiee`. false: elle est `non_verifiable` (reprise du cours, signalee comme telle). Une affirmation en `erreur` n'est jamais reprise." }
    Transcription:
      type: object
      required: [jobId, docType, pages, photoUrls, photoUrlsExpireAt]
      description: "Le scan est lu comme UN document (v1.3): pages lues dans l'ordre, avec le contexte des pages voisines; `docType`, `suggestedSubject` et `suggestedTopic` sont decides une seule fois sur l'ensemble; les phrases coupees entre deux pages sont recollees (`Sentence.pages`). `pages` est trie par numero de page croissant (numerique, jamais lexical) et contient une entree par page, meme sans phrase."
      properties:
        jobId: { type: string }
        docType: { type: string, enum: [cours, exercice, autre], description: "Un seul type pour tout le scan" }
        pages:
          type: array
          items:
            type: object
            required: [page, sentences]
            properties:
              page: { type: integer, minimum: 1 }
              sentences: { type: array, items: { $ref: '#/components/schemas/Sentence' } }
        suggestedSubject: { $ref: '#/components/schemas/Subject' }
        suggestedTopic: { $ref: '#/components/schemas/Topic' }
        suggestedSections:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/SuggestedSection' }
          description: "Decoupage suggere (v1.3), au plus 6 sections; la premiere commence a la premiere phrase. Absent: pas de decoupage suggere (une seule section)."
        context:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/Sentence' }
          description: "Facultatif (v1.6), ajout de pages seulement: les deux dernieres phrases du cours, en LECTURE SEULE (ni corrigees, ni retirees, ni coupees). Absent hors ajout. Les `pages` de la transcription ne contiennent que les nouvelles pages, numerotees a la suite du cours (cours de 4 pages, ajout de 2: pages 5 et 6)."
        photoUrls: { type: array, items: { type: string, format: uri }, description: "Dans l'ordre des pages ENVOYEES (1 par page, la premiere est la photo de la premiere page de `pages`)" }
        photoUrlsExpireAt: { type: string, format: date-time }
        blocks:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/Block' }
          description: "Facultatif (v1.5): mise en forme du document, dans l'ordre. Absent (job ancien): l'ecran retombe sur la liste de phrases de `pages`. Chaque phrase de `pages` est dans exactement un bloc."
        figures:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/Figure' }
          description: "Facultatif (v1.5): figures proposees par la lecture, 8 au plus par scan; l'eleve les confirme avec `ConfirmRequest.figures`. Les `url` de recadrage sont re-signees a chaque appel et expirent avec la photo."
    ConfirmRequest:
      type: object
      required: [corrections]
      properties:
        corrections: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Sentence' } }
        sections:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/ConfirmSection' }
          description: "Facultatif (v1.3): decoupage du texte en sections par sujet, dans l'ordre du texte (voir la route). Absent: une seule section."
        subject: { $ref: '#/components/schemas/Subject' }
        topic: { $ref: '#/components/schemas/Topic', description: "Un sujet vide apres nettoyage (espaces, chevrons, caracteres invisibles) repond 400 `requete_invalide`: le schema ne le detecte pas, le serveur le controle." }
        folderId: { type: string, minLength: 1, maxLength: 64, description: "Dossier de l'eleve (404 s'il n'existe pas); remplace celui de la creation" }
        figures:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ConfirmFigure' }
          description: "Facultatif (v1.5): choix de l'eleve pour chaque figure proposee. Une figure absente de la liste n'est PAS conservee (par defaut, rien n'est garde). Un `figureId` inconnu: 400 `requete_invalide`."
        removed:
          type: array
          maxItems: 500
          items: { type: string, pattern: '^p[0-9]+-s[0-9]+$' }
          description: "Facultatif (v1.5): phrases retirees du cours par l'eleve (bruit, remarque personnelle). Elles ne sont pas gardees dans le cours, ni extraites, ni verifiees. Une phrase retiree ne peut pas etre le `fromSentenceId` d'une section; une phrase inconnue: 400. Le seuil de 40 mots s'applique apres retrait."
        added:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AddedSentence' }
          description: "Facultatif (v1.10, M1 #89): phrases oubliees ajoutees par l'eleve, apres une phrase donnee ou tout au debut. 20 au plus et 6000 caracteres au total (limite dite ici, controlee par le serveur). Chaque phrase ajoutee est extraite et verifiee dans les sources COMME UNE PHRASE LUE, sans traitement de faveur: si aucune source ne la confirme elle reste non verifiable et ne donne aucune question. Le texte est une entree de l'eleve: il est controle (LaTeX) et jamais interprete comme une consigne. Refus 400 `requete_invalide` (rien n'est modifie): ancre inconnue, cle en double, ancre vers un ajout plus tard dans le tableau, phrase vide, LaTeX invalide, 20 ajouts ou 6000 caracteres depasses, seuil de 40 mots. Le serveur attribue les identifiants `p<page>-s<n>` (plus grand numero de la page + 1, retraits compris); aucun identifiant existant ne change. Eleve seulement."
    ReviseRequest:
      type: object
      description: "Modification d'un cours confirme (v1.11, M1 #90). 20 changements au plus au total (`corrections` + `removed` + `added`, limite controlee par le serveur). Memes regles que la relecture: `corrections` (id + texte), `removed`, `added` (`AddedSentence`, ancre = une phrase du cours ou une cle d'ajout plus haut). Refuse: retirer la premiere phrase d'une section ou toutes ses phrases, descendre sous 40 mots."
      properties:
        corrections: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Sentence' } }
        removed: { type: array, maxItems: 20, items: { type: string, pattern: '^p[0-9]+-s[0-9]+$' } }
        added: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/AddedSentence' } }
    RevisionFiche:
      type: object
      required: [docId, etat]
      properties:
        docId: { type: string }
        etat: { type: string, enum: [en_cours, terminee, echec] }
        numerosRestants: { type: integer, minimum: 0, maximum: 99, description: "Numeros libres de la fiche avant `fiche_trop_revisee` (99 moins le plus grand numero pris). Un avertissement s'affiche sous 20; une modification en reserve 20." }
    Revision:
      type: object
      required: [revisionId, coursId, etat, fiches, createdAt]
      description: "Etat d'une modification. Aucun champ ne porte de texte du cours."
      properties:
        revisionId: { type: string }
        coursId: { type: string }
        etat: { type: string, enum: [en_cours, terminee, echec] }
        etape: { type: string, enum: [preparation, verification, generation, validation] }
        fiches: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/RevisionFiche' } }
        message: { type: string, maxLength: 200, description: "Message constant, jamais un texte du cours" }
        createdAt: { type: string, format: date-time }
    AddedSentence:
      type: object
      required: [key, afterId, text]
      properties:
        key: { type: string, pattern: '^n[0-9]{1,2}$', description: "Cle temporaire choisie par le client (n1, n2...), unique dans la requete; sert d'ancre a un autre ajout et de `fromSentenceId` d'une section." }
        afterId: { type: [string, 'null'], pattern: '^(p[0-9]+-s[0-9]+|n[0-9]{1,2})$', description: "Phrase APRES laquelle vient l'ajout (identifiant de `Transcription`, jamais le contexte grise d'un ajout de pages) ou cle d'un ajout PLUS HAUT dans le tableau; `null`: tout au debut du texte." }
        text: { type: string, minLength: 3, maxLength: 2000, description: "Texte de la phrase, LaTeX permis (`$...$`), meme controle que `corrections`." }
        newBlock: { type: boolean, description: "true: nouveau paragraphe apres le bloc de l'ancre. Sinon la phrase rejoint le paragraphe ou la liste de l'ancre; apres un titre ou une formule, ou au debut du texte, c'est toujours un nouveau paragraphe." }
    DocSummary:
      type: object
      required: [docId, title, subject, createdAt]
      properties:
        docId: { type: string }
        title: { type: string, maxLength: 200 }
        subject: { $ref: '#/components/schemas/Subject' }
        createdAt: { type: string, format: date-time }
        topic: { $ref: '#/components/schemas/Topic' }
        folderId: { type: string }
        coursId: { type: string, description: "Cours complet d'ou vient la fiche (v1.3); absent pour une fiche ancienne ou si le cours a ete supprime" }
        questionCount: { type: integer, minimum: 0, description: "Taille de la banque de questions (v1.7): un nombre, jamais un contenu (visible aussi par le parent). Absent pour une fiche ancienne." }
        sectionIndex: { type: integer, minimum: 0, maximum: 5 }
        exerciceCount: { type: integer, minimum: 0, maximum: 5, description: "Exercices de la fiche (1.9.0): un nombre, jamais un contenu" }
    ExerciceEtat: { type: string, enum: [generation, prete, echec] }
    ExerciceResume:
      type: object
      required: [exoId, etat, points, xpPaye, solutionVue]
      properties:
        exoId: { type: string }
        titre: { type: string, maxLength: 80 }
        etat: { $ref: '#/components/schemas/ExerciceEtat' }
        points: { type: integer, enum: [10], description: "XP maximal de l'exercice" }
        meilleurMilli: { type: integer, minimum: 0, maximum: 1000 }
        xpPaye: { type: integer, minimum: 0, maximum: 10 }
        solutionVue: { type: boolean }
    ExerciceList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/ExerciceResume' } }
    ExerciceCreated:
      type: object
      required: [exoId, etat]
      properties:
        exoId: { type: string }
        etat: { $ref: '#/components/schemas/ExerciceEtat' }
    Exercice:
      type: object
      description: "Ce que l'eleve peut voir. AUCUN champ pour le bareme, les attendus, la valeur finale, les indices non vus ni la solution (test de contrat)."
      required: [exoId, docId, etat, points, indicesVus, indicesTotal, indicesDonnes, nbCopies, copiesRestantes, solutionVue]
      properties:
        exoId: { type: string }
        docId: { type: string }
        etat: { $ref: '#/components/schemas/ExerciceEtat' }
        titre: { type: string, maxLength: 80 }
        enonce: { type: string, maxLength: 1500, description: "Texte avec LaTeX `$...$` (controle par le serveur, rendu KaTeX)" }
        points: { type: integer, enum: [10] }
        indicesVus: { type: integer, minimum: 0, maximum: 3 }
        indicesTotal: { type: integer, enum: [3] }
        indicesDonnes: { type: array, maxItems: 3, items: { type: string, maxLength: 200 }, description: "Indices deja demandes, dans l'ordre" }
        nbCopies: { type: integer, minimum: 0, maximum: 3 }
        copiesRestantes: { type: integer, minimum: 0, maximum: 3 }
        solutionVue: { type: boolean }
    ExerciceHint:
      type: object
      required: [rang, texte, indicesRestants]
      properties:
        rang: { type: integer, minimum: 1, maximum: 3 }
        texte: { type: string, maxLength: 200 }
        indicesRestants: { type: integer, minimum: 0, maximum: 2 }
    ExerciceSolution:
      type: object
      required: [solution]
      properties:
        solution: { type: string, maxLength: 2500 }
    CopieCreateRequest:
      type: object
      required: [pages, contentType]
      properties:
        pages: { type: integer, minimum: 1, maximum: 3 }
        contentType: { type: string, enum: [image/jpeg, image/png] }
    CopieEnvoi:
      type: object
      required: [page, url, fields]
      properties:
        page: { type: integer, minimum: 1, maximum: 3 }
        url: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
    CopieCreateResponse:
      type: object
      required: [copieId, envois, expireA]
      properties:
        copieId: { type: string }
        envois: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/CopieEnvoi' } }
        expireA: { type: string, format: date-time }
    CopieSubmitResponse:
      type: object
      required: [etat]
      properties:
        etat: { type: string, enum: [en_correction] }
    CopieEtat: { type: string, enum: [a_envoyer, en_correction, corrigee, illisible, echec, annulee] }
    CopieEtape:
      type: object
      required: [id, libelle, statut, indice]
      properties:
        id: { type: string }
        libelle: { type: string, maxLength: 120 }
        statut: { type: string, enum: [ok, partiel, faux, absent, reporte] }
        indice: { type: string, maxLength: 200 }
    Copie:
      type: object
      required: [copieId, exoId, etat, solutionVue]
      properties:
        copieId: { type: string }
        exoId: { type: string }
        etat: { $ref: '#/components/schemas/CopieEtat' }
        motif: { type: string, enum: [copie_deja_rendue, budget, technique, plafond_cout], description: "Seulement pour `echec`" }
        etapes: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/CopieEtape' }, description: "Seulement pour `corrigee`" }
        finale: { type: object, required: [libelle, statut], properties: { libelle: { type: string, maxLength: 120 }, statut: { type: string, enum: [juste, fausse, absente] } } }
        scoreMilli: { type: integer, minimum: 0, maximum: 1000 }
        bilan: { type: string, maxLength: 120 }
        xpGagne: { type: integer, minimum: 0, maximum: 10 }
        solutionVue: { type: boolean }
        badges: { type: array, items: { type: string } }
    DocList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DocSummary' } }
    Source:
      type: object
      required: [passageId, url, site, titre, extrait, niveau]
      properties:
        passageId: { type: string }
        url: { type: string, format: uri, pattern: '^https://' }
        site: { type: string }
        titre: { type: string }
        extrait: { type: string, maxLength: 1000 }
        niveau: { type: integer, minimum: 1, maximum: 3 }
    Claim:
      type: object
      required: [claimId, text, status, aRisque, sources]
      properties:
        claimId: { type: string }
        text: { type: string, maxLength: 1000, description: "Texte de l'affirmation. Depuis la v1.5 le texte peut contenir du LaTeX (`$...$`), controle par le serveur et rendu par le site (voir `Sentence.text`)." }
        status: { type: string, enum: [verifiee, erreur, non_verifiable, non_factuelle] }
        aRisque: { type: boolean }
        sentenceId: { type: string, pattern: '^p[0-9]+-s[0-9]+$', description: "Facultatif (v1.5): phrase du cours d'ou vient l'affirmation (celle de `Cours.texts` et `Cours.marks`). Absent pour une fiche ancienne ou si le cours a ete supprime." }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
    Doc:
      allOf:
        - $ref: '#/components/schemas/DocSummary'
        - type: object
          required: [summary, claims]
          properties:
            summary: { type: string, description: "Texte continu de la fiche. Depuis la v1.5 il reprend `body` (paragraphes separes par une ligne vide, sans le rappel): un client 1.4 continue de fonctionner." }
            claims: { type: array, items: { $ref: '#/components/schemas/Claim' } }
            body:
              type: array
              maxItems: 8
              items: { $ref: '#/components/schemas/FicheParagraph' }
              description: "Facultatif (v1.5): la fiche en plusieurs paragraphes. Absent pour une fiche ancienne (un seul bloc `summary`)."
            recall:
              type: array
              maxItems: 12
              items: { $ref: '#/components/schemas/RecallItem' }
              description: "Facultatif (v1.5): rappel final des elements importants (dates, formules, definitions, nombres). Vide ou absent s'il n'y en a pas."
            figures:
              type: array
              maxItems: 8
              items: { $ref: '#/components/schemas/Figure' }
              description: "Facultatif (v1.5): figures du cours utiles a la fiche, avec `url` pre-signee. Absentes si le cours a ete supprime (les figures partent avec lui). Eleve seulement."

    ReportRequest:
      type: object
      required: [comment]
      properties:
        claimId: { type: string }
        comment: { type: string, minLength: 1, maxLength: 500 }
    ReportValidateRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [valide, rejete] }
    Report:
      type: object
      required: [reportId, status]
      properties:
        reportId: { type: string }
        docId: { type: string }
        claimId: { type: string }
        status: { type: string, enum: [ouvert, valide, rejete] }
    Question:
      description: Jamais de cle de reponse dans une question (test L3/L4).
      type: object
      required: [questionId, kind, prompt]
      properties:
        questionId: { type: string }
        kind: { type: string, enum: [qcm, gap] }
        prompt: { type: string, maxLength: 1000, description: "Enonce. Depuis la v1.5 le texte peut contenir du LaTeX (`$...$`), controle par le serveur et rendu par le site (voir `Sentence.text`)." }
        choices: { type: array, minItems: 4, maxItems: 4, items: { type: string, maxLength: 300 }, description: "Choix; ils peuvent contenir du LaTeX comme l'enonce." }
        docId: { type: string, description: "Fiche d'origine (v1.7), seulement pour un test sur plusieurs fiches" }
        docTitle: { type: string, maxLength: 200, description: "Titre de la fiche d'origine (v1.7), seulement pour un test sur plusieurs fiches" }
    Session:
      type: object
      required: [docId, questions]
      properties:
        docId: { type: string }
        questions: { type: array, items: { $ref: '#/components/schemas/Question' } }
        available: { type: integer, minimum: 0, description: "Questions distinctes utilisables dans la banque (v1.7), hors questions proches" }
        short: { type: boolean, description: "Vrai si le test est plus court que demande (v1.7)" }
        xpRemaining: { type: integer, minimum: 0, maximum: 50, description: "Points encore gagnables sur la fiche (v1.7): 50 au plus par fiche, pour toute la vie de la fiche" }
    PracticeRequest:
      type: object
      description: "Exactement un de `docIds` ou `folderId`."
      properties:
        docIds: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        folderId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        size: { type: integer, enum: [5, 10, 15, 20], default: 10 }
    PracticeSession:
      type: object
      required: [scope, title, docIds, questions, available, short, skipped]
      properties:
        scope: { type: string, enum: [fiches, dossier] }
        title: { type: string, maxLength: 200 }
        docIds: { type: array, maxItems: 10, items: { type: string }, description: "Fiches reellement interrogees, dans l'ordre" }
        questions: { type: array, items: { $ref: '#/components/schemas/Question' } }
        available: { type: integer, minimum: 0 }
        short: { type: boolean }
        xpRemaining:
          type: array
          description: "Points encore gagnables par fiche (50 au plus par fiche)"
          items: { type: object, required: [docId, xpRemaining], properties: { docId: { type: string }, xpRemaining: { type: integer, minimum: 0, maximum: 50 } } }
        skipped:
          type: array
          items:
            type: object
            required: [docId, reason]
            properties:
              docId: { type: string }
              title: { type: string, maxLength: 200, description: "Seulement pour une fiche de l'eleve (jamais pour un identifiant inconnu ou d'un autre eleve)" }
              reason: { type: string, enum: [sans_question, introuvable] }
    AnswerRequest:
      type: object
      required: [questionId, choice]
      properties:
        questionId: { type: string }
        choice: { type: string, maxLength: 300 }
    Progress:
      type: object
      required: [xp, level, streakDays, freezes, stage, pagesRemaining, pagesLimit, resetDate]
      properties:
        xp: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 0 }
        streakDays: { type: integer, minimum: 0 }
        freezes: { type: integer, minimum: 0 }
        stage: { type: integer, minimum: 1, maximum: 5 }
        pagesRemaining: { type: integer, minimum: 0 }
        pagesLimit: { type: integer, minimum: 0 }
        resetDate: { type: string, format: date }
        badges: { type: array, items: { type: string, pattern: '^[a-z0-9_]{1,40}$' }, description: Identifiants de badges obtenus; catalogue dans docs/game-rules.md }
    ReadResult:
      type: object
      required: [xpGained, badges, progress]
      properties:
        xpGained: { type: integer, minimum: 0 }
        badges: { type: array, items: { type: string, pattern: '^[a-z0-9_]{1,40}$' } }
        progress: { $ref: '#/components/schemas/Progress' }
    ActivationRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 2, maxLength: 20, pattern: "^[A-Za-zÀ-ÖØ-öø-ÿŒœ][A-Za-zÀ-ÖØ-öø-ÿŒœ0-9 '’-]{1,19}$", description: "Surnom choisi par l'eleve (1.8.0). Absent = on garde le surnom de depart donne par le parent. Lettres latines seulement; la liste de mots et les chiffres en trop sont controles par le serveur avant de consommer le jeton." }
    ActivationResponse:
      type: object
      required: [loginId, displayName]
      properties:
        loginId: { type: string, description: "Identifiant de connexion de l'eleve (ex. lila-7k2fm), a montrer a l'ecran seulement" }
        displayName: { type: string }
        displayNameChanged: { type: boolean, description: "Vrai si le surnom demande etait devenu indisponible entre-temps et qu'on a garde le surnom de depart" }
    LoginIdResponse:
      type: object
      required: [loginId]
      properties:
        loginId: { type: string }
    AnswerResult:
      type: object
      required: [correct, xpGained, badges, progress]
      properties:
        correct: { type: boolean }
        correctAnswer: { type: string, description: Revele seulement apres la reponse }
        xpGained: { type: integer, minimum: 0 }
        retired: { type: boolean, description: "v1.11: la question a ete retiree par une correction du cours pendant que la session etait ouverte; elle est corrigee normalement, sans point. Ecrit par la partie 2 de M1 #90." }
        capped: { type: boolean, description: "Vrai si la reponse aurait rapporte des points mais la fiche a atteint 50 XP (v1.7); `xpGained` vaut alors 0 pour cette part" }
        badges: { type: array, items: { type: string } }
        progress: { $ref: '#/components/schemas/Progress' }
    Me:
      type: object
      required: [userId, role, familyId]
      properties:
        userId: { type: string }
        role: { type: string, enum: [parent, eleve] }
        familyId: { type: string }
        studentId: { type: string, description: Present pour le role eleve }
        pseudo: { type: string, description: "Eleve seulement. Valeur de `loginId` (compatibilite 1.8.0, a retirer apres le deploiement commun)" }
        loginId: { type: string, description: "Eleve seulement (1.8.0): identifiant de connexion. Jamais present pour un parent." }
        displayName: { type: string, description: "Eleve seulement (1.8.0): surnom affiche" }
        policyOutdated: { type: boolean, description: "Parent seulement (contract-v1.4.1). Vrai si la famille a donne son consentement sur une autre version de la politique que celle en vigueur: le front demande alors de la relire et de l'accepter (POST /family/policy). Absent pour un eleve." }
    Student:
      type: object
      required: [studentId, pseudo, loginId, displayName, schoolLevel, under15, status, pageQuota]
      properties:
        studentId: { type: string }
        pseudo: { type: string, description: "Valeur de `loginId` (compatibilite 1.8.0: un ancien site y lit l'identifiant avec lequel l'eleve se connecte). Obsolete." }
        loginId: { type: string, description: "Identifiant de connexion fabrique par le serveur (lila-7k2fm). Anciens comptes: l'ancien pseudo." }
        displayName: { type: string, description: "Surnom affiche. Anciens comptes: l'ancien pseudo sans le suffixe." }
        schoolLevel: { type: string, enum: [seconde, premiere, terminale] }
        under15: { type: boolean }
        status: { type: string, enum: [actif, suspendu] }
        pageQuota: { type: integer, minimum: 0, maximum: 500, description: "Plafond reel = plafond de la famille de l environnement (50 en prod, 500 en dev), verifie par le serveur" }
        sharing: { type: boolean, description: "Partage de QCM par lien active par le parent pour cet eleve (v1.12). Absent = faux (ferme par defaut, y compris pour les plus de 15 ans)." }
    StudentCreateRequest:
      type: object
      required: [pseudo, schoolLevel, under15, parentalAuthority, policyVersion]
      properties:
        pseudo: { type: string, pattern: "^[A-Za-z][A-Za-z0-9 -]{1,19}$", description: "Surnom de depart (sans nom de famille): base de l'identifiant de connexion et surnom affiche par defaut. Le serveur applique en plus les regles de surnom (400 `pseudo_refuse`)" }
        schoolLevel: { type: string, enum: [seconde, premiere, terminale] }
        under15: { type: boolean }
        parentalAuthority: { type: boolean, const: true, description: Case cochee par le parent (autorite parentale et lecture de la politique) }
        policyVersion: { $ref: '#/components/schemas/PolicyVersion' }
    PolicyVersion:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Version de la politique affichee au parent. Refusee si ce n'est pas la version en vigueur.
    FamilyCreateRequest:
      type: object
      required: [consent, policyVersion]
      properties:
        consent: { type: boolean, const: true }
        policyVersion: { $ref: '#/components/schemas/PolicyVersion' }
    InvitationCreated:
      type: object
      required: [code, createdAt, remainingToday]
      properties:
        code: { type: string, pattern: '^[0-9a-f]{32}$', description: Code d'invitation en clair, affiche une seule fois. }
        createdAt: { type: string, format: date-time }
        remainingToday: { type: integer, minimum: 0, maximum: 20, description: Codes restants aujourd'hui pour cet administrateur. }
    ActivationLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    StudentCreateResponse:
      type: object
      required: [student, activationLink]
      properties:
        student: { $ref: '#/components/schemas/Student' }
        activationLink: { $ref: '#/components/schemas/ActivationLink' }
    StudentUpdateRequest:
      type: object
      minProperties: 1
      description: under15 ne se modifie pas (supprimer puis recreer l'eleve). `displayName` renomme l'eleve (memes regles que a l'activation).
      properties:
        displayName: { type: string, minLength: 2, maxLength: 20, pattern: "^[A-Za-zÀ-ÖØ-öø-ÿŒœ][A-Za-zÀ-ÖØ-öø-ÿŒœ0-9 '’-]{1,19}$" }
        status: { type: string, enum: [actif, suspendu] }
        pageQuota: { type: integer, minimum: 0, maximum: 500, description: "Plafond reel = plafond de la famille de l environnement (50 en prod, 500 en dev), verifie par le serveur" }
        schoolLevel: { type: string, enum: [seconde, premiere, terminale] }
        sharing: { type: boolean, description: "Active ou coupe le partage de QCM par lien pour cet eleve (v1.12). `false` ne fait que poser le drapeau (creation refusee tout de suite): supprimer ensuite les liens par `DELETE /students/{sid}/shares`." }
    Dashboard:
      type: object
      required: [students, familyPagesRemaining, familyPagesLimit]
      properties:
        students:
          type: array
          items:
            type: object
            required: [student, progress]
            properties:
              student: { $ref: '#/components/schemas/Student' }
              progress: { $ref: '#/components/schemas/Progress' }
        familyPagesRemaining: { type: integer, minimum: 0 }
        familyPagesLimit: { type: integer, minimum: 0 }
    Leaderboard:
      type: object
      required: [week, entries]
      properties:
        week: { type: string, pattern: '^[0-9]{4}-W[0-9]{2}$' }
        entries:
          type: array
          items:
            type: object
            required: [studentId, pseudo, xp, activeDays]
            properties:
              studentId: { type: string }
              pseudo: { type: string }
              xp: { type: integer, minimum: 0 }
              activeDays: { type: integer, minimum: 0, maximum: 7 }
    FamilyExport:
      type: object
      required: [familyId, exportedAt, students, docs, reports]
      properties:
        familyId: { type: string }
        exportedAt: { type: string, format: date-time }
        parentEmail: { type: string }
        consentement: { $ref: '#/components/schemas/Consent' }
        students: { type: array, items: { $ref: '#/components/schemas/StudentExport' } }
        docs: { type: array, items: { $ref: '#/components/schemas/DocExport' } }
        reports: { type: array, items: { $ref: '#/components/schemas/ReportExport' } }
    Consent:
      type: object
      properties:
        consentementLe: { type: string, format: date-time }
        versionPolitique: { type: string }
    StudentExport:
      allOf:
        - $ref: '#/components/schemas/Student'
        - type: object
          required: [activeDays, attempts, profile]
          properties:
            consentement: { $ref: '#/components/schemas/Consent' }
            createdAt: { type: string }
            folders: { type: array, items: { $ref: '#/components/schemas/Folder' }, description: "Dossiers de l'eleve (v1.3)" }
            cours: { type: array, items: { $ref: '#/components/schemas/CoursMeta' }, description: "Cours conserves (v1.3), SANS le texte (structure, sections, liens vers les fiches). Le texte se lit par GET /cours (eleve)." }
            profile:
              type: object
              description: Profil de jeu (XP, serie, badges, signalements valides)
              additionalProperties: true
            activeDays: { type: array, items: { type: string }, description: Jours (Paris) ou l'eleve a joue }
            shares: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ShareExport' }, description: "Liens de partage de l'eleve (v1.12): titre, nombre de questions, dates, etat, lectures. Sans jeton, sans copie, sans question." }
            testsCount: { type: integer, minimum: 0, description: "Nombre de passages de test conserves (v1.4). Le detail est dans l'archive `POST /family/export/archive`." }

            attempts:
              type: array
              items:
                type: object
                required: [questionId, date, attempts]
                properties:
                  questionId: { type: string }
                  date: { type: string }
                  attempts: { type: integer }
    TestSummary:
      type: object
      description: "Un passage de test. `scorePct` = round(100 x correct / total); `total` = questions de la session ouverte, meme non repondues."
      required: [testId, docId, titre, matiere, mode, schoolYear, startedAt, total, answered, correct, firstTry, scorePct, xpGained, status]
      properties:
        testId: { type: string }
        docId: { type: string }
        titre: { type: string, maxLength: 200, description: "Titre de la fiche au moment du test (copie courte, supprimee avec la fiche)" }
        matiere: { type: string }
        mode: { type: string, description: "Valeurs connues: `mixte`, `qcm`, `gap`. Un client traite une valeur inconnue comme `autre` (des modes s'ajouteront, par exemple le tirage de l'issue #42)." }
        schoolYear: { type: string, pattern: '^[0-9]{4}-[0-9]{4}$', description: "Annee scolaire de `startedAt` (Europe/Paris): du 1er septembre au 31 aout. Septembre a decembre de l'annee Y donne `Y-(Y+1)`, janvier a aout de l'annee Y donne `(Y-1)-Y`. Calculee a l'ecriture, jamais modifiee." }
        startedAt: { type: string, format: date-time, description: Ouverture de la session }
        endedAt: { type: string, format: date-time, description: "Derniere reponse du passage (absent si aucune)" }
        total: { type: integer, minimum: 1 }
        answered: { type: integer, minimum: 0 }
        correct: { type: integer, minimum: 0, description: Questions finalement justes }
        firstTry: { type: integer, minimum: 0, description: Questions justes du premier coup }
        scorePct: { type: integer, minimum: 0, maximum: 100 }
        xpGained: { type: integer, minimum: 0 }
        status: { type: string, enum: [complet, incomplet], description: "`complet` quand `answered` = `total`" }
        scope: { type: string, enum: [fiche, fiches, dossier], description: "Q1 (v1.7): absent ou `fiche` = une seule fiche. `titre` est alors le titre de la fiche, le nom du dossier ou `N fiches` (copie; pour un passage multi-fiches, seules les lignes de la fiche supprimee partent)." }
        docIds: { type: array, maxItems: 10, items: { type: string }, description: "Fiches interrogees (v1.7); `docId` reste la premiere" }
    TestQuestionStatus:
      type: object
      description: "Resultat d'une question dans un passage, sans aucun texte."
      required: [questionId, rank, kind, correct, attempts, firstTry, xpGained, answeredAt]
      properties:
        questionId: { type: string }
        rank: { type: integer, minimum: 1, description: Position de la question dans la session }
        kind: { type: string, enum: [qcm, gap, exo], description: "`exo` (1.9.0): etape d'un exercice (`<docId>:exo:<nn>#<etapeId>`), sans aucun texte" }
        correct: { type: boolean }
        attempts: { type: integer, minimum: 1, maximum: 2 }
        firstTry: { type: boolean }
        xpGained: { type: integer, minimum: 0 }
        answeredAt: { type: string, format: date-time }
    TestQuestionResult:
      allOf:
        - $ref: '#/components/schemas/TestQuestionStatus'
        - type: object
          properties:
            choice: { type: string, maxLength: 300, description: Derniere reponse donnee par l'eleve. Visible de l'eleve seul. }
    TestDetail:
      allOf:
        - $ref: '#/components/schemas/TestSummary'
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/TestQuestionResult'
                  - type: object
                    properties:
                      prompt: { type: string, maxLength: 1000, description: "Relu dans la fiche (absent si la question n'existe plus)" }
                      choices: { type: array, items: { type: string, maxLength: 300 } }
                      correctAnswer: { type: string, description: Present seulement si la question est terminee }
                      retired: { type: boolean, description: "v1.11: question retiree apres une correction du cours (le prompt reste lisible). Ecrit par la partie 2 de M1 #90." }
    TestPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TestSummary' } }
        nextCursor: { type: string, maxLength: 512, description: Absent sur la derniere page }
        schoolYears: { type: array, items: { type: string, pattern: '^[0-9]{4}-[0-9]{4}$' }, description: "Annees scolaires ayant des passages, la plus recente d'abord. Present sur la premiere page seulement." }
    TestParentDetail:
      description: "Passage vu par le parent et ecrit dans l'archive: resultat par question, sans texte ni reponse donnee."
      allOf:
        - $ref: '#/components/schemas/TestSummary'
        - type: object
          required: [questions]
          properties:
            questions: { type: array, items: { $ref: '#/components/schemas/TestQuestionStatus' } }
    ExportArchive:
      type: object
      required: [url, expiresAt, format, sizeBytes, students, tests, truncated]
      properties:
        url: { type: string, format: uri, description: Lien signe, valable 10 minutes }
        expiresAt: { type: string, format: date-time }
        format: { type: string, enum: [zip] }
        sizeBytes: { type: integer, minimum: 0 }
        students: { type: integer, minimum: 0 }
        tests: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        courses: { type: integer, minimum: 0, description: "Facultatif (v1.5, archive de l'eleve): nombre de cours dans l'archive" }
        figures: { type: integer, minimum: 0, description: "Facultatif (v1.5, archive de l'eleve): nombre de figures (fichiers JPEG) dans l'archive" }
        omittedCourses: { type: integer, minimum: 0, description: "Facultatif (v1.5.1, archive de l'eleve): cours les plus anciens dont les figures ont ete omises pour tenir dans 150 Mo (leur texte est dans l'archive). `truncated` vaut alors vrai." }
    ExportStatus:
      type: object
      required: [exportId, state]
      description: "Demande d'archive de l'eleve (v1.5.1). `archive` est present quand `state` vaut `pret`."
      properties:
        exportId: { type: string }
        state: { type: string, enum: [en_cours, pret, echec] }
        archive: { $ref: '#/components/schemas/ExportArchive' }
    DocProgress:
      type: object
      required: [docId, titre, matiere, pages, createdAt, tests]
      properties:
        docId: { type: string }
        titre: { type: string }
        matiere: { type: string }
        sujet: { type: string }
        pages: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        tests: { type: integer, minimum: 0 }
        bestScorePct: { type: integer, minimum: 0, maximum: 100 }
        lastScorePct: { type: integer, minimum: 0, maximum: 100 }
        lastTestAt: { type: string, format: date-time }
    ScanProgress:
      type: object
      description: "Scan en cours ou recent: etape et nombre de pages seulement."
      required: [scanId, stage, pages, createdAt]
      properties:
        scanId: { type: string }
        stage: { type: string, description: "Etape du traitement, meme vocabulaire que `status` de GET /scans" }
        pages: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    WeekStat:
      type: object
      required: [week, tests, avgScorePct, activeDays]
      properties:
        week: { type: string, pattern: '^[0-9]{4}-W[0-9]{2}$' }
        tests: { type: integer, minimum: 0 }
        avgScorePct: { type: integer, minimum: 0, maximum: 100 }
        activeDays: { type: integer, minimum: 0, maximum: 7 }
    SubjectStat:
      type: object
      required: [matiere, tests, avgScorePct]
      properties:
        matiere: { type: string }
        tests: { type: integer, minimum: 0 }
        avgScorePct: { type: integer, minimum: 0, maximum: 100 }
    StudentProgressView:
      type: object
      required: [student, progress, docs, scans, weeks, subjects, schoolYears, recentTests]
      properties:
        student: { $ref: '#/components/schemas/Student' }
        progress: { $ref: '#/components/schemas/Progress' }
        docs: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/DocProgress' }, description: Fiches les plus recentes d'abord }
        scans: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ScanProgress' } }
        weeks: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/WeekStat' }, description: "Douze dernieres semaines, la plus recente d'abord" }
        subjects: { type: array, items: { $ref: '#/components/schemas/SubjectStat' } }
        schoolYears: { type: array, items: { type: string, pattern: '^[0-9]{4}-[0-9]{4}$' }, description: "Annees scolaires ayant des passages, la plus recente d'abord" }
        recentTests: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TestSummary' } }
    ExportQuestion:
      type: object
      required: [questionId, kind, prompt, answer]
      properties:
        questionId: { type: string }
        kind: { type: string, enum: [qcm, gap] }
        prompt: { type: string }
        choices: { type: array, items: { type: string } }
        answer: { type: string }
    DocExport:
      allOf:
        - $ref: '#/components/schemas/DocSummary'
        - type: object
          required: [studentId, summary, claims, questions]
          properties:
            studentId: { type: string }
            summary: { type: string }
            claims: { type: array, items: { $ref: '#/components/schemas/Claim' } }
            questions: { type: array, items: { $ref: '#/components/schemas/ExportQuestion' } }
    ReportExport:
      type: object
      required: [reportId, docId, comment, status, createdAt]
      properties:
        reportId: { type: string }
        docId: { type: string }
        claimId: { type: string }
        studentId: { type: string }
        comment: { type: string }
        status: { type: string, enum: [ouvert, valide, rejete] }
        createdAt: { type: string }
    ShareToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{22}$'
      description: "Jeton de 128 bits en base64url (22 caracteres). Jamais stocke (seul son hache SHA-256 l'est), renvoye une seule fois a la creation."
    ShareState:
      type: string
      enum: [actif, suspendu]
      description: "`suspendu`: 3 signalements recus. L'expiration se lit sur `expiresAt`."
    ShareableQuestion:
      type: object
      required: [questionId, kind, shareable]
      description: "`prompt`, `choices` et `answer` ou `expected` ne sont presents que si `shareable` est vrai."
      properties:
        questionId: { type: string }
        kind: { type: string, enum: [qcm, gap] }
        prompt: { type: string, maxLength: 1000 }
        choices: { type: array, minItems: 4, maxItems: 4, items: { type: string, maxLength: 300 } }
        answer: { type: integer, minimum: 0, maximum: 3, description: "Indice du bon choix (qcm)" }
        expected: { type: string, maxLength: 300, description: "Mot attendu (trou)" }
        shareable: { type: boolean }
        reason: { type: string, enum: [a_jouer, donnee_personnelle, retiree], description: "Present quand `shareable` est faux" }
    ShareableList:
      type: object
      required: [questions]
      properties:
        questions: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ShareableQuestion' } }
    ShareCreateRequest:
      type: object
      required: [docId, questionIds, title]
      properties:
        docId: { type: string, minLength: 1, maxLength: 64 }
        questionIds: { type: array, minItems: 5, maxItems: 20, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 80 }, description: "Questions de la fiche `docId`, partageables" }
        title: { type: string, minLength: 3, maxLength: 60, description: "Titre court ecrit par l'eleve. Memes regles de forme que le surnom, et filtre de donnees personnelles. Jamais repris du titre de la fiche." }
        ttlDays: { type: integer, enum: [1, 7, 30], default: 7 }
    ShareCreated:
      type: object
      required: [shareId, token, expiresAt]
      properties:
        shareId: { type: string }
        token: { $ref: '#/components/schemas/ShareToken' }
        expiresAt: { type: string, format: date-time }
    ShareSummary:
      type: object
      required: [shareId, title, count, createdAt, expiresAt, state, reads, reports]
      description: "Un lien, sans le jeton ni les questions."
      properties:
        shareId: { type: string }
        title: { type: string, maxLength: 60 }
        count: { type: integer, minimum: 5, maximum: 20, description: Nombre de questions }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/ShareState' }
        reads: { type: integer, minimum: 0, description: "Somme des lectures sur la vie du lien" }
        reports: { type: integer, minimum: 0 }
    MyShare:
      allOf:
        - $ref: '#/components/schemas/ShareSummary'
        - type: object
          required: [outdated]
          properties:
            outdated: { type: boolean, description: "La fiche a ete modifiee depuis la copie (la copie reste figee)" }
    MyShareList:
      type: object
      required: [shares]
      properties:
        shares: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/MyShare' } }
    StudentShareList:
      type: object
      required: [shares, purgePending]
      properties:
        shares: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ShareSummary' } }
        purgePending: { type: boolean, description: "Le partage est coupe (`sharing` faux) mais des liens restent: rejouer `DELETE /students/{sid}/shares`" }
    ShareExport:
      type: object
      required: [title, count, createdAt, expiresAt, state, reads]
      description: "Un lien dans l'export. Ni jeton, ni copie, ni question."
      properties:
        title: { type: string, maxLength: 60 }
        count: { type: integer, minimum: 5, maximum: 20 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/ShareState' }
        reads: { type: integer, minimum: 0 }
    ShareOpenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 3000, description: "Jeton du lien (forme emise: 22 caracteres base64url, voir `ShareToken`). Toute autre chaine recoit le meme `404 lien_indisponible`, sans acces a la table." }
    ShareReportRequest:
      type: object
      required: [token, reason]
      properties:
        token: { type: string, maxLength: 3000, description: "Jeton du lien (forme emise: 22 caracteres base64url, voir `ShareToken`). Toute autre chaine recoit le meme `404 lien_indisponible`, sans acces a la table." }
        reason: { type: string, enum: [inapproprie, donnees_perso, autre] }
    SharedQuestion:
      type: object
      required: [kind, prompt]
      description: "Liste blanche: aucun identifiant de fiche, de question, d'affirmation, d'eleve ou de famille. `qcm`: `choices` et `answer`. `gap`: `expected` (compare avec `normalizeGap`)."
      properties:
        kind: { type: string, enum: [qcm, gap] }
        prompt: { type: string, maxLength: 1000 }
        choices: { type: array, minItems: 4, maxItems: 4, items: { type: string, maxLength: 300 } }
        answer: { type: integer, minimum: 0, maximum: 3 }
        expected: { type: string, maxLength: 300 }
    SharedQuiz:
      type: object
      required: [title, questions, expiresAt]
      description: "Copie figee, publique. Jamais de nom, pseudo, identifiant, cours, photo, schema, exercice, affirmation, source ni point."
      properties:
        title: { type: string, maxLength: 60 }
        subject: { $ref: '#/components/schemas/Subject' }
        questions: { type: array, minItems: 5, maxItems: 20, items: { $ref: '#/components/schemas/SharedQuestion' } }
        expiresAt: { type: string, format: date-time }
