      responses:
        '200':
          description: Progression
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
              example: { xp: 110, level: 2, streakDays: 3, freezes: 1, stage: 1, pagesRemaining: 18, pagesLimit: 20, resetDate: '2027-01-01' }
  /me/tests:
    get:
      operationId: listMyTests
      tags: [game]
      summary: "Historique des tests de l'eleve connecte, du plus recent au plus ancien, pagine (contract-v1.4, H1; handler tests-read)"
      description: |
        Une entree par passage de test (voir docs/H1-design.md). Reserve a l'eleve: un parent recoit 403. L'eleve ne lit jamais l'historique d'un autre eleve, meme de sa famille (la cle de partition vient du jeton).
        Pagination par curseur opaque: renvoyer `nextCursor` tel quel dans `cursor`. Le curseur ne contient qu'une position de tri; la partition est toujours reconstruite depuis le jeton, un curseur ne peut donc pas lire ailleurs. Un curseur invalide donne 400.
        Les passages sont conserves jusqu'a la suppression de la fiche, de l'eleve ou de la famille. Ils se regroupent par **annee scolaire** (1er septembre au 31 aout, fuseau Europe/Paris): `schoolYear` dans chaque passage, filtre `schoolYear` en requete, liste `schoolYears` sur la premiere page.
      parameters:
        - { $ref: '#/components/parameters/TestLimit' }
        - { $ref: '#/components/parameters/TestCursor' }
        - { $ref: '#/components/parameters/SchoolYear' }
        - { name: docId, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 64 }, description: Seulement les passages sur cette fiche }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: "Premier jour inclus (fuseau Europe/Paris)" }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: "Dernier jour inclus (fuseau Europe/Paris)" }
      responses:
        '200':
          description: Page de passages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPage' }
              example:
                items:
                  - { testId: 01JF5T3ST0000000000000AAAA, docId: 01JEXAMPLE0DOC0000000000AA, titre: La photosynthese, matiere: svt, mode: mixte, schoolYear: 2026-2027, startedAt: '2026-12-01T17:02:11Z', endedAt: '2026-12-01T17:06:40Z', total: 10, answered: 10, correct: 8, firstTry: 7, scorePct: 80, xpGained: 63, status: complet }
                  - { testId: 01JF5T3ST0000000000000ABAA, docId: 01JEXAMPLE0DOC0000000000AB, titre: La Revolution francaise, matiere: histoire_geo, mode: qcm, schoolYear: 2026-2027, startedAt: '2026-11-30T18:30:00Z', endedAt: '2026-11-30T18:32:05Z', total: 10, answered: 4, correct: 3, firstTry: 3, scorePct: 30, xpGained: 15, status: incomplet }
                schoolYears: ['2026-2027', '2025-2026']
                nextCursor: VEVTVCMyMDI2LTExLTMwVDE4OjMwOjAwWiMwMUpGNVQzU1QwMDAwMDAwMDAwMDAwQUJBQQ
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/tests/{testId}:
    get:
      operationId: getMyTest
      tags: [game]
      summary: "Detail d'un passage de test: resultat de chaque question (contract-v1.4, H1; handler tests-read)"
      description: |
        Reserve a l'eleve proprietaire. `prompt` et `choices` sont relus dans la fiche au moment de la lecture (rien du cours n'est copie dans l'historique). `correctAnswer` n'est present que pour une question terminee (juste, ou 2 essais, ou texte a trous repondu): c'est ce que l'eleve a deja eu le droit de voir.
        Un passage d'un autre eleve donne 404.
      parameters: [{ $ref: '#/components/parameters/TestId' }]
      responses:
        '200':
          description: Passage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDetail' }
              example:
                testId: 01JF5T3ST0000000000000AAAA
                docId: 01JEXAMPLE0DOC0000000000AA
                titre: La photosynthese
                matiere: svt
                mode: mixte
                schoolYear: 2026-2027
                startedAt: '2026-12-01T17:02:11Z'
                endedAt: '2026-12-01T17:06:40Z'
                total: 2
                answered: 2
                correct: 1
                firstTry: 1
                scorePct: 50
                xpGained: 5
                status: complet
                questions:
                  - { questionId: 'qcm-01', rank: 1, kind: qcm, correct: true, attempts: 1, firstTry: true, xpGained: 5, answeredAt: '2026-12-01T17:02:40Z', choice: Du dioxygene, prompt: Que produit la photosynthese ?, choices: [Du dioxygene, Du dioxyde de carbone, De l'azote, De l'eau], correctAnswer: Du dioxygene }
                  - { questionId: 'gap-01', rank: 2, kind: gap, correct: false, attempts: 1, firstTry: false, xpGained: 0, answeredAt: '2026-12-01T17:06:40Z', choice: azote, prompt: La photosynthese produit du ____., correctAnswer: dioxygene }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{sid}/progress:
    get:
      operationId: getStudentProgress
      tags: [family]
      summary: "Vue parent, lecture seule: avancement d'un eleve de la famille (contract-v1.4, H1; handler family-progress)"
      description: |
        Reserve au parent. L'eleve doit etre de la famille du jeton, sinon **404** (pas 403: on ne revele pas l'existence d'un eleve d'une autre famille). Un eleve qui appelle recoit 403.
        Contenu: progression de jeu, une ligne par fiche (titre, matiere, pages, resultats des tests), tendance par semaine, scores par matiere, derniers tests. Jamais le texte d'un cours ni d'une question, jamais une reponse donnee ni la bonne reponse. Le resultat (juste ou faux) de chaque question se lit par `GET /students/{sid}/tests/{testId}`.
