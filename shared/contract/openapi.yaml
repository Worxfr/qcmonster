        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cours/{coursId}:
    get:
      operationId: getCours
      tags: [cours]
      summary: "Le cours complet corrige, par phrases, avec son decoupage et les liens vers les fiches (handler cours-api). Eleve seulement: le parent a 403 (l'export parent n'a pas le texte)."
      description: "`coursId` vient de `DocSummary.coursId` ou de `ScanSummary.coursId`. Un lien de section vers une fiche supprimee n'a plus de `docId` (statut `supprimee`)."
      parameters: [{ $ref: '#/components/parameters/CoursId' }]
      responses:
        '200':
          description: Cours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cours' }
              example:
                coursId: 01JEXAMPLE0CRS0000000000AA
                createdAt: '2026-12-01T10:05:00Z'
                pages: 2
                texts:
                  - page: 1
                    sentences: [{ id: p1-s1, text: La photosynthese produit du dioxygene. }]
                  - page: 2
                    sentences: [{ id: p2-s1, text: La Revolution commence en 1789. }]
                sections:
                  - { fromSentenceId: p1-s1, subject: svt, topic: La photosynthese, title: La photosynthese, status: fiche, docId: 01JEXAMPLE0DOC0000000000AA }
                  - { fromSentenceId: p2-s1, subject: histoire_geo, status: ignoree }
                figureCount: 1
                blocks:
                  - { id: b1, kind: paragraphe, sentenceIds: [p1-s1] }
                  - { id: b2, kind: figure, figureId: f1 }
                  - { id: b3, kind: paragraphe, sentenceIds: [p2-s1] }
                figures:
                  - { figureId: f1, page: 1, kind: schema, alt: Schema de la photosynthese, url: 'https://qcm-dev-figures.s3.eu-west-3.amazonaws.com/figures/x/f1.jpg?X-Amz-Signature=example', urlExpireAt: '2026-12-01T10:10:00Z' }
                marks:
                  - { sentenceId: p1-s1, status: verifiee, docId: 01JEXAMPLE0DOC0000000000AA, claimId: '01' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteCours
      tags: [cours]
      summary: "Supprime le texte du cours (eleve seulement: 403 pour le parent, qui supprime par le compte de l'eleve). Option explicite `fiches`: `garder` (les fiches restent, sans lien vers le cours: `coursId`, `sectionIndex` et `sectionCount` retires) ou `supprimer` (les fiches du cours sont supprimees aussi). La copie de travail du texte (7 jours) est supprimee aussi. Supprimer une fiche ne supprime jamais le cours (handler cours-api)"
      parameters:
        - { $ref: '#/components/parameters/CoursId' }
        - { name: fiches, in: query, required: true, description: "Obligatoire, pas de valeur par defaut: l'eleve choisit", schema: { type: string, enum: [garder, supprimer] } }
      responses:
        '204': { description: Supprime }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Un ajout de pages est ouvert sur ce cours (v1.6, `etat_invalide`): annule-le d'abord.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: etat_invalide, message: Un ajout est en cours } } } }
  /answers:
    post:
      operationId: postAnswer
