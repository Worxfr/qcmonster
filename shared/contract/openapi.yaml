        Eleve seulement (403 pour un parent). Exactement un de `docIds` (1 a 10 fiches) ou `folderId`. Un `docId` inconnu ou d'un autre eleve n'est pas une erreur: il est range dans `skipped` (`introuvable`), sans difference visible. Un dossier de plus de 10 fiches: les 10 les moins recemment travaillees. Ouvrir une session remet la serie a zero et ferme le test precedent (un seul test ouvert par eleve).
