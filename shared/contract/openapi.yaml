        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "`etat_invalide`: la validation a commence ou la modification est finie", content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: etat_invalide, message: "Cette modification ne peut plus etre annulee" } } } }
  /practice/session:
