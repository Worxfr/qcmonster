openapi: 3.1.0
info:
  title: QCMonster API
  version: 1.6.0
  description: |
    Contrat d'API QCMonster (contract-v1.6.0, additif par rapport a v1.5.1 (F10, docs/F10-design.md): ajout de pages a la fin d'un cours existant (`ScanCreateRequest.coursId`, un ajout = un scan ordinaire), relecture des seules nouvelles pages avec deux phrases de contexte en lecture seule (`Transcription.context`, `Sentence.continuesId`), code d'erreur `cours_plein` (409), cours jusqu'a 30 pages et 20 sections (`CoursMeta`), `Job.coursId`; contract-v1.5.1, additif par rapport a v1.5.0 (R1-A): archive de l'eleve construite en asynchrone (`POST /me/export/archive`, `GET /me/export/archive/{exportId}`, `ExportStatus`, `ExportArchive.omittedCourses`) et code d'erreur `indisponible` (503, confirmation avec figures); contract-v1.5, additif par rapport a v1.4.1 (R1, docs/R1-design.md): structure du cours en blocs (titres, paragraphes, listes, formules, figures) au-dessus des phrases (`Transcription.blocks`, `Cours.blocks`), phrases douteuses a la relecture (`Sentence.doubt`), figures recadrees confirmees par l'eleve (`Transcription.figures`, `ConfirmRequest.figures`, `Cours.figures`), retrait de phrases (`ConfirmRequest.removed`), statut de verification par phrase du cours (`Cours.marks`, `Claim.sentenceId`), fiche en paragraphes avec rappel final (`Doc.body`, `Doc.recall`); formules en LaTeX dans le texte des phrases; champs facultatifs `courses` et `figures` de `ExportArchive` (archive de l'eleve, route a ajouter par le lot A, voir docs/R1-design.md 3.6); aucun champ requis nouveau dans une requete; contract-v1.4.1, additif par rapport a v1.4.0: `Me.policyOutdated` et `POST /family/policy` pour la re-acceptation de la politique de confidentialite; contract-v1.4, additif par rapport a v1.3: historique des tests de l'eleve (`/me/tests`, regroupe par annee scolaire), vue parent en lecture seule (`/students/{sid}/progress`, `/students/{sid}/tests`, resultat par question), archive d'export (`POST /family/export/archive`); contract-v1.3, additif par rapport a v1.2: scans de plusieurs pages (`uploads`, `contentTypes`), liste de scans filtrable et triable (GET /scans), statut detaille (`status`), matiere et sujet modifiables (PATCH /docs/{docId}), dossiers de l'eleve (/folders); contract-v1.2: ajoute POST /admin/invitations, reserve au groupe Cognito `admin`; v1.1, additif par rapport a v1.0: activation eleve publique, creation de famille, lecture de fiche, badges, cout par job). Fixe par L1c (design-v2 section 6).
    Les schemas Zod et les types TypeScript sont GENERES dans shared/contract/generated/ (npm run gen).
    Ne jamais editer les fichiers generes. Une demande de changement = PR sur ce fichier, relue par le proprietaire de L1c (shared/**, contrat).
servers:
  - url: http://localhost:4010
    description: API simulee (npm run mock)
security:
  - bearerAuth: []
tags:
  - { name: scans }
  - { name: docs }
  - { name: game }
  - { name: family }
  - { name: admin }
  - { name: folders }
  - { name: cours }
paths:
  /scans:
    post:
      operationId: createScan
      tags: [scans]
      summary: Reserve le quota, cree le job, renvoie une URL POST pre-signee (handler scans-create, L2a)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanCreateRequest' }
            example: { pages: 2, contentType: image/jpeg, contentTypes: [image/jpeg, image/png], folderId: 01JEXAMPLE0FLD0000000000AA, coursId: 01JEXAMPLE0CRS0000000000AA }
      responses:
        '201':
          description: |
            Job cree. **Une page = une photo = une URL pre-signee** (`uploads`, dans l'ordre des pages). Les `pages` sont reservees toutes ensemble
            (tout ou rien, `429` sinon) et rendues si le job echoue, est annule ou expire. Le traitement demarre quand les `pages` fichiers sont arrives.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanCreateResponse' }
              example:
                jobId: 01JEXAMPLE0JOB0000000000AA
                upload:
                  url: https://qcm-dev-scans.s3.eu-west-3.amazonaws.com/
                  fields: { key: scans/01JEXAMPLE0STU0000000000AA/01JEXAMPLE0JOB0000000000AA/0, Content-Type: image/jpeg }
                uploads:
                  - page: 1
                    url: https://qcm-dev-scans.s3.eu-west-3.amazonaws.com/
                    fields: { key: scans/01JEXAMPLE0STU0000000000AA/01JEXAMPLE0JOB0000000000AA/0, Content-Type: image/jpeg }
                  - page: 2
                    url: https://qcm-dev-scans.s3.eu-west-3.amazonaws.com/
                    fields: { key: scans/01JEXAMPLE0STU0000000000AA/01JEXAMPLE0JOB0000000000AA/1, Content-Type: image/png }
                expiresAt: '2026-12-01T10:15:00Z'
                pagesRemaining: 16
        '400':
          description: |
            Requete invalide. **PDF refuse en v1**: `contentType: application/pdf` (valeur encore listee dans l'enum, reservee a une version suivante) repond 400 `requete_invalide`
            AVANT toute reservation de page ni creation de job; le client doit envoyer des photos (image/jpeg ou image/png, une demande par envoi).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                pdf: { summary: PDF non pris en charge en v1, value: { code: requete_invalide, message: 'Les PDF ne sont pas encore pris en charge: envoie des photos' } }
                champ: { summary: Champ manquant ou hors limites, value: { code: requete_invalide, message: Demande invalide } }
                types: { summary: "`contentTypes` n'a pas `pages` elements", value: { code: requete_invalide, message: Demande invalide } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Ajout de pages (`coursId`) impossible, AVANT toute reservation de page. `etat_invalide`: le cours est encore en cours de creation, ou un autre ajout est ouvert (il dure jusqu'a la confirmation ou l'annulation, 12 h au plus). `cours_plein` (v1.6): le cours depasserait 30 pages, ou a deja 20 sections.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                plein: { summary: Le cours depasserait ses limites, value: { code: cours_plein, message: Ce cours est complet (30 pages et 20 sections au plus) } }
                ouvert: { summary: Un ajout est deja ouvert, value: { code: etat_invalide, message: Un autre ajout est en cours pour ce cours } }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
    get:
      operationId: listScans
      tags: [scans]
      summary: Liste des scans de l'eleve (en cours, termines, en echec), filtrable et triable (handler scans-list)
      description: |
        Un scan = un job (`scanId` = `jobId`). La liste reunit les jobs encore presents (7 jours) et les fiches (sans limite de duree): un scan termine dont le job a expire reste liste, avec `status.stage: termine`.
        **Eleve**: voit uniquement ses scans. **Parent**: voit ceux de ses eleves (tous, ou un seul avec `studentId`; un eleve d'une autre famille repond 404). Lecture seule pour le parent.
        Les filtres se combinent (ET). `facets` et `inProgress` portent sur tous les scans visibles, sans les filtres, pour construire les menus.
        **Scans a relire**: un scan `a_confirmer` reste ouvert jusqu'a `status.expiresAt` (12 h apres la fin de la lecture). L'eleve le reprend par `scanId` (= `jobId`) avec `GET /jobs/{jobId}/transcription` puis `POST /jobs/{jobId}/confirm`, depuis n'importe quel appareil connecte au meme compte, apres rechargement ou changement d'ecran: le front n'a rien a retenir. `toReview` compte ces scans, `status=a_confirmer` les liste, `sort=date&order=asc` donne en premier le plus ancien (le plus proche de l'expiration). Passe l'echeance, le scan devient `echec` (`Job.state: expire`) avec un message lisible, visible 7 jours.
        Le front interroge cette route toutes les 3 s tant qu'un scan est `en_cours` (voir docs/scan-screens.md), sans nouvelle ressource AWS.
        Aucun texte de cours dans la reponse, sauf le titre et le sujet (courts, `title` et `topic`). Le parent voit donc l'etape, les pages, le titre et le sujet des scans de ses eleves, y compris en cours, jamais le texte lu.
      parameters:
        - { name: studentId, in: query, required: false, description: "Parent seulement: un eleve de la famille. Un eleve qui passe un identifiant, le sien excepte, recoit 404 (comme un parent dont l'eleve n'est pas de sa famille: jamais de 403 qui confirmerait l'existence).", schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: subject, in: query, required: false, description: "Matiere, ou `none` pour les scans sans matiere (job en cours de lecture)", schema: { type: string, enum: [maths, physique, svt, histoire_geo, francais, autre, none] } }
        - { name: topic, in: query, required: false, description: "Sujet, comparaison sans casse ni accents (egalite exacte apres normalisation)", schema: { type: string, minLength: 1, maxLength: 80 } }
        - { name: folderId, in: query, required: false, description: "Un dossier de l'eleve, ou `none` pour les scans hors dossier. Un dossier inconnu (ou d'un autre eleve) repond 404.", schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: status, in: query, required: false, description: "`en_cours` = tout ce qui n'est pas termine ni en echec (y compris `a_confirmer`)", schema: { type: string, enum: [en_cours, a_confirmer, termine, echec] } }
        - { name: sort, in: query, required: false, description: "Tri principal (defaut `date`). `subject` puis `topic` puis date; `topic` puis date; `status` = ordre des etapes. Les valeurs absentes passent en dernier.", schema: { type: string, enum: [date, subject, topic, status], default: date } }
        - { name: order, in: query, required: false, description: "Sens du tri principal. Defaut selon `sort`: `desc` pour `date` et `status`, `asc` pour `subject` et `topic`. A egalite, la date decroissante departage toujours.", schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, description: "Valeur opaque `nextCursor` de la page precedente. Valable seulement avec les memes filtres et le meme tri; sinon la page peut avoir des doublons ou des trous. Un curseur invalide repond 400.", schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Scans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanList' }
              example:
                items:
                  - scanId: 01JEXAMPLE0JOB0000000000AA
                    studentId: 01JEXAMPLE0STU0000000000AA
                    state: termine
                    docId: 01JEXAMPLE0DOC0000000000AA
                    title: La Revolution francaise
                    subject: histoire_geo
                    topic: La Revolution francaise
                    folderId: 01JEXAMPLE0FLD0000000000AA
                    pages: 2
                    createdAt: '2026-12-01T10:00:00Z'
                    status: { stage: termine, pagesDone: 2, pagesTotal: 2, startedAt: '2026-12-01T10:00:00Z', finishedAt: '2026-12-01T10:03:00Z' }
                  - scanId: 01JEXAMPLE0JOB0000000000AB
                    studentId: 01JEXAMPLE0STU0000000000AA
                    state: transcription
                    pages: 3
                    createdAt: '2026-12-01T11:00:00Z'
                    status: { stage: lecture, pagesDone: 1, pagesTotal: 3, startedAt: '2026-12-01T11:00:00Z' }
                  - scanId: 01JEXAMPLE0JOB0000000000AC
                    studentId: 01JEXAMPLE0STU0000000000AA
                    state: a_confirmer
                    subject: svt
                    topic: La photosynthese
                    pages: 1
                    createdAt: '2026-12-01T09:00:00Z'
                    status: { stage: a_confirmer, pagesDone: 1, pagesTotal: 1, startedAt: '2026-12-01T09:00:00Z', expiresAt: '2026-12-01T21:00:00Z', expiresSoon: false }
                inProgress: 2
                toReview: 1
                facets:
                  subjects: [{ subject: histoire_geo, count: 1 }]
                  topics: [{ topic: La Revolution francaise, count: 1 }]
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /scans/{scanId}:
    delete:
      operationId: deleteScan
      tags: [scans]
      summary: "L'eleve supprime un scan non confirme, a tout moment (handler scans-delete)"
      description: |
        `scanId` = `jobId`. Eleve proprietaire seulement: le parent repond 403, un scan d'un autre eleve (ou d'une autre famille) 404.
        Autorise tant que le scan n'est pas confirme: envoi, lecture, `a_confirmer`, et scans en echec ou expires encore listes. Efface la photo et le texte de travail, rend les pages du quota UNE seule fois (une suppression rejouee ne rend rien de plus), libere la machine de traitement (jeton d'envoi ou de confirmation): une confirmation tardive repond 409 et ne cree aucune fiche.
        Un scan deja supprime ou annule repond 404 (idempotent: rien n'est rendu une seconde fois). Un scan confirme (verification, generation) repond 409 `etat_invalide`; un scan termine se supprime par ses fiches (`DELETE /docs/{docId}`).
      parameters: [{ $ref: '#/components/parameters/ScanId' }]
      responses:
        '204': { description: Supprime }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [scans]
      summary: Etat du traitement; `status` donne l'etape, les pages traitees et le message d'echec (handler jobs-get, L2a)
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200':
          description: Etat du job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                jobId: 01JEXAMPLE0JOB0000000000AA
                state: transcription
                pages: 2
                createdAt: '2026-12-01T10:00:00Z'
                status: { stage: lecture, pagesDone: 1, pagesTotal: 2, startedAt: '2026-12-01T10:00:00Z' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{jobId}/transcription:
    get:
      operationId: getTranscription
      tags: [scans]
      summary: Texte numerote et URL pre-signee de lecture de la photo, 5 min (handler jobs-transcription, L2a)
      description: "Appelable autant de fois que voulu, depuis n'importe quel appareil de l'eleve, tant que le job est `a_confirmer` (jusqu'a `status.expiresAt`). Les URL de photo sont re-signees a chaque appel. Apres l'echeance: 409 `etat_invalide`."
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200':
          description: Transcription a confirmer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcription' }
              example:
                jobId: 01JEXAMPLE0JOB0000000000AA
                docType: cours
                pages:
                  - page: 1
                    sentences:
                      - { id: p1-s1, text: La photosynthese produit du dioxygene. }
                      - { id: p1-s2, doubt: true, text: 'Les plantes vertes utilisent la lumiere du soleil pour fabriquer leur matiere a partir du gaz carbonique de l''air.', pages: [1, 2] }
                  - page: 2
                    sentences:
                      - { id: p2-s2, text: Ce phenomene a lieu dans les chloroplastes. }
                suggestedSubject: svt
                suggestedTopic: La photosynthese
                blocks:
                  - { id: b1, kind: titre, level: 1, sentenceIds: [p1-s1] }
                  - { id: b2, kind: paragraphe, sentenceIds: [p1-s2, p2-s2] }
                  - { id: b3, kind: figure, figureId: f1 }
                figures:
                  - { figureId: f1, page: 2, kind: schema, alt: 'Schema d''une feuille avec les entrees de lumiere et de gaz carbonique', caption: Fig. 1 La feuille, box: { x: 0.1, y: 0.4, w: 0.8, h: 0.35 }, url: 'https://qcm-dev-scans.s3.eu-west-3.amazonaws.com/scans/x/fig/f1.jpg?X-Amz-Signature=example' }
                photoUrls: ['https://qcm-dev-scans.s3.eu-west-3.amazonaws.com/scans/x/0?X-Amz-Signature=example']
                photoUrlsExpireAt: '2026-12-01T10:05:00Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /jobs/{jobId}/confirm:
    post:
      operationId: confirmJob
      tags: [scans]
      summary: Texte corrige, decoupage en sections, reprend le workflow (handler jobs-confirm, L2a)
      description: |
        `corrections` remplace le texte de phrases existantes. **`sections` (v1.3)** decoupe le texte en sections par sujet: chaque section non ignoree devient UNE fiche (matiere, sujet, titre, dossier propres; extraction, verification et QCM sur son seul texte). Le cours complet corrige est conserve (voir `Cours`); la photo est supprimee a la confirmation comme avant.
        Une section commence a la phrase `fromSentenceId` et va jusqu'a la phrase qui precede la section suivante (ou la fin). Les coupes tombent entre deux phrases, sur une page ou a cheval sur deux (une phrase recollee sur deux pages ne se coupe pas). `ignore: true` garde le texte dans le cours mais ne cree pas de fiche (par exemple la fin d'un autre chapitre).
        Sans `sections` (client 1.2: `{ corrections: [...] }`, ou avec `subject`, `topic`, `folderId`): une seule section couvre tout, avec `subject`, `topic` et `folderId` de la requete (ou les propositions de `Transcription`). **Replis (client 1.2 sans matiere)**: matiere = `suggestedSubject`, sinon `draftSubject` du job, sinon `autre`, jamais un 400. Un `folderId` absent prend celui donne a la creation du scan (`POST /scans`). `sections` et `subject`/`topic`/`folderId` ensemble: 400. **Avec `sections`, une section sans `folderId` herite du `folderId` du job** (creation ou confirmation precedente); `title` et `topic` sont nettoyes (espaces, chevrons, caracteres invisibles) par le serveur.
        Regles (400 `requete_invalide`, rien n'est modifie): au plus 6 sections **et au plus 2 par page du scan** (`min(6, 2 x pages)`: 2 pour 1 page, 4 pour 2, 6 des 3 pages); la premiere commence a la toute premiere phrase; `fromSentenceId` inconnu, en double ou pas dans l'ordre croissant du texte; au moins une section non ignoree; chaque section contient au moins une phrase; le texte des sections non ignorees compte moins de 40 mots **au total** (seuil `MIN_WORDS` de la transcription; il s'applique a l'ensemble des sections retenues, jamais a chaque section: une petite section isolee reste acceptee); un `topic` ou `title` vide apres nettoyage; un `folderId` inconnu (404). Le quota de pages est consomme UNE fois pour le scan, quel que soit le nombre de sections; le plafond de cout `max(0,25 ; 0,15 x pages)` vaut pour l'ensemble du job (somme des sections).
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRequest' }
            example:
              corrections: []
              figures: [{ figureId: f1, keep: true }]
              removed: [p2-s9]
              sections:
                - { fromSentenceId: p1-s1, subject: svt, topic: La photosynthese, title: La photosynthese }
                - { fromSentenceId: p2-s2, subject: histoire_geo, topic: La Revolution francaise, folderId: 01JEXAMPLE0FLD0000000000AA }
      responses:
        '200':
          description: Job repris
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                jobId: 01JEXAMPLE0JOB0000000000AA
                state: verification
                pages: 2
                createdAt: '2026-12-01T10:00:00Z'
        '503':
          description: "Erreur de stockage pendant la copie des figures gardees (`indisponible`, v1.5.1): rien n'a change, l'eleve renvoie la meme confirmation."
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: indisponible, message: Service momentanément indisponible, réessaie } } }
        '400':
          description: "Demande invalide. Cas propres aux sections: phrase inconnue, coupes pas dans l'ordre ou en double, premiere section pas au debut, plus de 6 sections, aucune section non ignoree, `sections` avec `subject`/`topic`/`folderId`, `topic` ou `title` vide apres nettoyage."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                inconnu: { summary: Identifiant inconnu, value: { code: requete_invalide, message: Phrase inconnue } }
                ordre: { summary: Coupes dans le desordre ou en double, value: { code: requete_invalide, message: Les coupes doivent suivre l'ordre du texte } }
                debut: { summary: Premiere section pas au debut, value: { code: requete_invalide, message: La premiere section doit commencer au debut du texte } }
                rien: { summary: Tout ignore, value: { code: requete_invalide, message: Il faut au moins une fiche } }
                court: { summary: Moins de 40 mots retenus, value: { code: requete_invalide, message: Il faut au moins 40 mots dans les parties gardees } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      tags: [scans]
      summary: Annule, supprime la photo, rend le quota (handler jobs-cancel, L2a)
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200':
          description: Job annule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                jobId: 01JEXAMPLE0JOB0000000000AA
                state: rejete
                pages: 2
                createdAt: '2026-12-01T10:00:00Z'
                message: Annulé par l'élève
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /docs:
    get:
      operationId: listDocs
      tags: [docs]
      summary: Liste des fiches (handler docs-read, L2a)
      responses:
        '200':
          description: Fiches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocList' }
              example:
                items:
                  - { docId: 01JEXAMPLE0DOC0000000000AA, title: La photosynthese, subject: svt, createdAt: '2026-12-01T10:03:00Z', topic: La photosynthese, folderId: 01JEXAMPLE0FLD0000000000AA }
  /docs/{docId}:
    get:
      operationId: getDoc
      tags: [docs]
      summary: Fiche avec pastilles et sources (handler docs-read, L2a)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: Fiche
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
              example:
                docId: 01JEXAMPLE0DOC0000000000AA
                title: La photosynthese
                subject: svt
                createdAt: '2026-12-01T10:03:00Z'
                summary: Les plantes fabriquent leur matiere avec la lumiere.
                body:
                  - { heading: Le principe, text: Les plantes fabriquent leur matiere avec la lumiere., claimIds: ['01'] }
                recall:
                  - { kind: definition, text: La photosynthese produit du dioxygene., claimId: '01', verified: true }
                claims:
                  - claimId: '01'
                    text: La photosynthese produit du dioxygene.
                    status: verifiee
                    aRisque: false
                    sentenceId: p1-s1
                    sources:
                      - passageId: 4f2a9c
                        url: https://fr.wikipedia.org/wiki/Photosynth%C3%A8se
                        site: fr.wikipedia.org
                        titre: Photosynthese
                        extrait: La photosynthese libere du dioxygene.
                        niveau: 2
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateDoc
      tags: [docs]
      summary: "L'eleve change la matiere et/ou le sujet de sa fiche (handler docs-patch). Le parent n'a pas ce droit (403)."
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocUpdateRequest' }
            example: { subject: histoire_geo, topic: La Revolution francaise }
      responses:
        '200':
          description: Fiche mise a jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocSummary' }
