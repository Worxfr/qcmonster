      responses:
        '200':
          description: Dossier renomme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
              example: { folderId: 01JEXAMPLE0FLD0000000000AA, name: Brevet blanc, createdAt: '2026-12-01T09:00:00Z', scanCount: 3 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Nom de dossier deja pris (sans tenir compte de la casse ni des accents)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: dossier_nom_pris, message: Tu as déjà un dossier avec ce nom }
