  /cours/{coursId}:
    get:
      operationId: getCours
      tags: [cours]
      summary: "Le cours complet corrige, par phrases, avec son decoupage et les liens vers les fiches (handler cours-api). Eleve seulement: le parent a 403 (l'export parent n'a pas le texte)."
      description: "`coursId` vient de `DocSummary.coursId` ou de `ScanSummary.coursId`. Un lien de section vers une fiche supprimee n'a plus de `docId` (statut `supprimee`)."
      parameters: [{ $ref: '#/components/parameters/CoursId' }]
      responses:
        '200':
          description: Cours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cours' }
              example:
                coursId: 01JEXAMPLE0CRS0000000000AA
                createdAt: '2026-12-01T10:05:00Z'
                pages: 2
                texts:
                  - page: 1
                    sentences: [{ id: p1-s1, text: La photosynthese produit du dioxygene. }]
                  - page: 2
                    sentences: [{ id: p2-s1, text: La Revolution commence en 1789. }]
                sections:
                  - { fromSentenceId: p1-s1, subject: svt, topic: La photosynthese, title: La photosynthese, status: fiche, docId: 01JEXAMPLE0DOC0000000000AA }
                  - { fromSentenceId: p2-s1, subject: histoire_geo, status: ignoree }
                figureCount: 1
                blocks:
                  - { id: b1, kind: paragraphe, sentenceIds: [p1-s1] }
                  - { id: b2, kind: figure, figureId: f1 }
                  - { id: b3, kind: paragraphe, sentenceIds: [p2-s1] }
                figures:
                  - { figureId: f1, page: 1, kind: schema, alt: Schema de la photosynthese, url: 'https://qcm-dev-figures.s3.eu-west-3.amazonaws.com/figures/x/f1.jpg?X-Amz-Signature=example', urlExpireAt: '2026-12-01T10:10:00Z' }
                marks:
                  - { sentenceId: p1-s1, status: verifiee, docId: 01JEXAMPLE0DOC0000000000AA, claimId: '01' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteCours
      tags: [cours]
      summary: "Supprime le texte du cours (eleve seulement: 403 pour le parent, qui supprime par le compte de l'eleve). Option explicite `fiches`: `garder` (les fiches restent, sans lien vers le cours: `coursId`, `sectionIndex` et `sectionCount` retires) ou `supprimer` (les fiches du cours sont supprimees aussi). La copie de travail du texte (7 jours) est supprimee aussi. Supprimer une fiche ne supprime jamais le cours (handler cours-api)"
      parameters:
        - { $ref: '#/components/parameters/CoursId' }
        - { name: fiches, in: query, required: true, description: "Obligatoire, pas de valeur par defaut: l'eleve choisit", schema: { type: string, enum: [garder, supprimer] } }
      responses:
        '204': { description: Supprime }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Un ajout de pages est ouvert sur ce cours (v1.6, `etat_invalide`): annule-le d'abord.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: etat_invalide, message: Un ajout est en cours } } } }
  /cours/{coursId}/revisions:
    post:
      operationId: createRevision
      tags: [cours]
      summary: "Modifie le texte d'un cours confirme: corriger, retirer ou ajouter des phrases (handler revise-create, M1 #90, v1.11). Eleve seulement: le parent a 403."
      description: |
        Une modification est un travail asynchrone sur une copie: rien n'est ecrit dans le cours ni dans les fiches avant la fin, un echec laisse tout intact. Une seule operation a la fois par cours (ajout de pages, modification, suppression). Les affirmations touchees sont retirees de la fiche (jamais effacees) et remplacees; les points deja gagnes restent comptes dans les 50 points de la fiche. Limites: 20 changements, 3 fiches touchees, 1 modification par cours et par jour, 2 par eleve et par jour, 0,10 EUR par modification, 0,50 EUR par mois et par eleve, 1,50 EUR par famille. Refus 400 `requete_invalide` (rien n'est modifie, message constant): phrase inconnue, premiere phrase d'une section, section vide, moins de 40 mots, LaTeX invalide, trop de changements ou de fiches. Un cours sans fiche touchee (sections ignorees) est modifie tout de suite: 200 `Revision` `terminee`. La route repond 404 tant qu'elle n'est pas activee sur l'environnement.
      parameters: [{ $ref: '#/components/parameters/CoursId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviseRequest' }
            example: { corrections: [{ id: p1-s2, text: Elle se deroule dans les chloroplastes des cellules vegetales. }], removed: [p1-s8], added: [{ key: n1, afterId: p1-s3, text: Phrase oubliee ajoutee apres la troisieme. }] }
      responses:
        '200':
          description: "Aucune fiche touchee: modification faite"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revision' }
              example: { revisionId: 01JEXAMPLE0REV0000000000AB, coursId: 01JEXAMPLE0CRS0000000000AA, etat: terminee, fiches: [], message: Modification terminée, createdAt: '2026-12-01T10:05:00Z' }
        '202':
          description: Modification lancee; l'ecran interroge `GET /cours/{coursId}/revisions/{revisionId}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revision' }
              example: { revisionId: 01JEXAMPLE0REV0000000000AA, coursId: 01JEXAMPLE0CRS0000000000AA, etat: en_cours, etape: preparation, fiches: [{ docId: 01JEXAMPLE0DOC0000000000AA, etat: en_cours }], createdAt: '2026-12-01T10:05:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`etat_invalide` (autre operation en cours sur le cours, fiche en generation ou en echec) ou `fiche_trop_revisee`"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: fiche_trop_revisee, message: "Cette fiche a ete trop retouchee : supprime-la et rescanne" } } }
        '429':
          description: "`plafond_revisions` ou `budget_epuise`"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: plafond_revisions, message: "Trop de modifications pour le moment" } } }
  /cours/{coursId}/revisions/{revisionId}:
    get:
      operationId: getRevision
      tags: [cours]
      summary: "Etat d'une modification (handler revise-get). Jamais de texte du cours."
      parameters: [{ $ref: '#/components/parameters/CoursId' }, { $ref: '#/components/parameters/RevisionId' }]
      responses:
        '200':
